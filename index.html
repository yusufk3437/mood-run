<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mood Run - KA-DO Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Varela+Round&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#6d5dfc;font-family:'Varela Round',sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#gc,#ui,.scr{position:absolute;top:0;left:0;width:100%;height:100%}
#gc{z-index:1}#ui{z-index:10;pointer-events:none}
.scr{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px;background:rgba(40,16,90,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .3s}
.scr.on{opacity:1;visibility:visible}
.ttl,.btn,.pill,.sk,.gd{font-family:'Fredoka',cursive;font-weight:600}
.ttl{text-align:center;text-shadow:0 4px 10px rgba(0,0,0,.35);line-height:1.1}
.btn{border:0;color:#fff;padding:14px 24px;font-size:18px;border-radius:30px;cursor:pointer;width:100%;max-width:290px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;background:var(--c,#3b82f6);box-shadow:0 6px 0 var(--d,#1e3a8a)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d,#1e3a8a)}
.btn[disabled]{opacity:.55;filter:grayscale(.7)}
.g{--c:#22c55e;--d:#14532d}.b{--c:#3b82f6;--d:#1e3a8a}.y{--c:#f59e0b;--d:#92400e}.p{--c:#a855f7;--d:#581c87}.k{--c:#6b7280;--d:#374151}
.btn svg,.pill svg{width:22px;height:22px;flex:none}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:2px solid #fff;border-radius:20px;padding:4px 12px;font-size:18px}
.note{opacity:.85;text-align:center;font-size:14px;max-width:290px;margin:0}
.err{color:#fde047;min-height:20px;margin:0;font-size:14px;text-align:center}
input{width:100%;max-width:290px;padding:12px 18px;border-radius:20px;border:3px solid #a78bfa;font:700 20px 'Varela Round',sans-serif;text-align:center;outline:none;color:#1e1b4b;-webkit-user-select:text;user-select:text}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.8);padding:8px 16px;border-radius:16px;font-weight:bold;display:none;max-width:90%;text-align:center;pointer-events:none}
#hud{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);display:none;flex-direction:column;gap:10px;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center}
#bar{width:58%;height:14px;margin:0 auto;background:rgba(255,255,255,.35);border:2px solid #fff;border-radius:10px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .3s}
#skin-grid,#gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:330px}
.sk,.gd{background:rgba(255,255,255,.14);border:3px solid transparent;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;min-height:92px;text-align:center}
.sel,.cur{border-color:#fde047;background:rgba(253,224,71,.22)}
.sk i{width:42px;height:42px;border-radius:50%;border:3px solid #fff;display:block}
.pr{display:flex;align-items:center;gap:3px}.pr svg{width:14px;height:14px}
#gift-dot{position:absolute;top:6px;right:16px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
#wheel{position:relative;display:flex;width:290px;height:36px;border-radius:18px;overflow:hidden;border:3px solid #fff}
#wheel b{flex:1;text-align:center;line-height:30px;font-family:'Fredoka',cursive}
#ptr{position:absolute;top:0;bottom:0;left:0;width:8px;background:#fff;box-shadow:0 0 8px #000;animation:sw 1.1s linear infinite alternate}
@keyframes sw{to{left:calc(100% - 8px)}}
.logo{display:flex;font-family:'Fredoka',cursive;font-weight:600;font-size:5.2rem;line-height:1}
.logo span{-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text}
.c1{background-image:linear-gradient(#7ae8f5,#3f9be6)}.c2{background-image:linear-gradient(#ffa957,#ef6a2a)}.dk{background-image:linear-gradient(#7ae8f5,#5fc4ef);margin:0 .05em}
.studio{letter-spacing:.55em;padding-left:.55em;font-size:1.5rem;color:#6fdff0;margin-top:4px}
.spin{position:relative;width:48px;height:48px}
.spin i{position:absolute;left:calc(50% - 2.5px);top:0;width:5px;height:13px;border-radius:3px;background:#fff;transform-origin:50% 24px;opacity:.15;animation:fd 1s linear infinite}
.spin.sm{transform:scale(.6)}
@keyframes bp{50%{transform:scale(1.18)}}
.bump{animation:bp .25s}
@keyframes fd{from{opacity:1}to{opacity:.15}}
.sk{min-height:112px}
#hearts{display:flex;justify-content:center;gap:6px}#hearts svg{width:26px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#lvl-map{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:14px;display:flex;align-items:center}
.nd{width:24px;height:24px;border-radius:50%;background:#5b4b8a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:600 11px 'Fredoka',sans-serif}
.nd.done{background:#22c55e}.nd.cur{background:#f59e0b;transform:scale(1.2)}.nd.bn{width:30px;height:30px;background:#7c3aed}.nd svg{width:20px;height:20px}
.ln{width:12px;height:3px;background:#fff;opacity:.5}
</style></head>
<body>
<div id="gc"></div>
<div id="toast"></div>
<div id="ui">
 <div id="hud"><div class="row"><div class="pill" id="hud-lvl"></div><div class="pill" id="hud-cp"><span data-ic="coin"></span><b id="hud-coins">0</b></div></div><div id="bar"><i id="bar-fill"></i></div><div id="hearts"></div></div>

 <div class="scr on" id="s-splash" style="background:#0f1730;-webkit-backdrop-filter:none;backdrop-filter:none" onclick="setScreen('s-menu')">
  <div class="logo"><span class="c1">KA</span><span class="dk">-</span><span class="c2">DO</span></div>
  <div class="studio">STUDIO</div>
  <div class="spin" style="margin-top:56px"></div>
 </div>

 <div class="scr" id="s-menu">
  <div class="pill" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px"><span data-ic="coin"></span><b class="cn">0</b></div>
  <div id="lvl-map"></div>
  <div class="ttl" style="font-size:3.6rem">MOOD<br><span style="color:#fde047">RUN</span></div>
  <div style="letter-spacing:.3em;opacity:.8;margin-bottom:10px">KA-DO Studio</div>
  <button class="btn g" onclick="onPlay()"><span data-i="play"></span></button>
  <button class="btn p" onclick="openShop()"><span data-i="shop"></span></button>
  <button class="btn y" onclick="openDaily()"><span data-ic="gift"></span><span data-i="daily"></span><i id="gift-dot"></i></button>
  <button class="btn b" onclick="openSettings()"><span data-i="settings"></span></button>
 </div>

 <div class="scr" id="s-name">
  <div class="ttl" style="font-size:2rem" data-i="nameQ"></div>
  <p class="note" data-i="nameNote"></p>
  <input id="name-in" maxlength="12" autocomplete="off" data-p="nameHint">
  <p id="name-err" class="err"></p>
  <button class="btn g" onclick="saveName()"><span data-i="next"></span></button>
 </div>

 <div class="scr" id="s-mode">
  <div class="ttl" style="font-size:2rem" data-i="play"></div>
  <button class="btn g" onclick="startSolo()"><span data-i="single"></span></button>
  <button class="btn b" onclick="setScreen('s-multi')"><span data-i="multi"></span></button>
  <button class="btn k" onclick="setScreen('s-menu')"><span data-i="back"></span></button>
 </div>

 <div class="scr" id="s-multi">
  <div class="ttl" style="font-size:2rem" data-i="multi"></div>
  <button class="btn b" onclick="showHost()"><span data-i="createRoom"></span></button>
  <button class="btn g" onclick="showJoin()"><span data-i="joinRoom"></span></button>
  <button class="btn k" onclick="setScreen('s-mode')"><span data-i="back"></span></button>
 </div>

 <div class="scr" id="s-host">
  <div class="ttl" style="font-size:2rem" data-i="hostT"></div>
  <p class="note" data-i="giveCode"></p>
  <div id="host-code" class="ttl" style="font-size:3.4rem;letter-spacing:.2em;color:#fde047">...</div>
  <div class="pill" id="host-cap"></div>
  <div class="spin sm" id="host-spin" style="display:none"></div>
  <button id="btn-start" class="btn g" style="display:none" onclick="startMultiplayer()"><span data-i="start"></span></button>
  <button class="btn k" onclick="backToStart()"><span data-i="cancel"></span></button>
  <p id="host-status" class="err"></p>
 </div>

 <div class="scr" id="s-join">
  <div class="ttl" style="font-size:2rem" data-i="joinT"></div>
  <p class="note" data-i="enterCode"></p>
  <input id="join-code" maxlength="4" placeholder="A1B2" style="text-transform:uppercase;font-size:30px;letter-spacing:.3em">
  <button class="btn g" onclick="joinByCode()"><span data-i="join"></span></button>
  <button class="btn k" onclick="backToStart()"><span data-i="back"></span></button>
  <div class="spin sm" id="join-spin" style="display:none"></div>
  <p id="join-status" class="err"></p>
 </div>

 <div class="scr" id="s-set">
  <div class="ttl" style="font-size:2rem" data-i="settings"></div>
  <div class="pill" id="set-name"></div>
  <button class="btn b" onclick="toggleLang()"><span id="lang-btn"></span></button>
  <button class="btn b" onclick="toggleSetting('sound')"><span id="btn-sound"></span></button>
  <button class="btn b" onclick="toggleSetting('vib')"><span id="btn-vib"></span></button>
  <button class="btn k" onclick="setScreen('s-menu')"><span data-i="back"></span></button>
 </div>

 <div class="scr" id="s-shop">
  <div class="pill" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px"><span data-ic="coin"></span><b class="cn">0</b></div>
  <div class="ttl" style="font-size:2rem" data-i="shop"></div>
  <div id="skin-grid"></div>
  <button class="btn y" onclick="watchAd50()"><span data-ic="ad"></span><span data-i="ad50"></span></button>
  <button class="btn k" onclick="setScreen('s-menu')"><span data-i="back"></span></button>
 </div>

 <div class="scr" id="s-daily">
  <div class="ttl" style="font-size:2rem" data-i="daily"></div>
  <div id="gift-grid"></div>
  <button class="btn g" id="btn-gift" onclick="claimGift()"><span data-ic="gift"></span><span id="gift-txt"></span></button>
  <button class="btn k" onclick="setScreen('s-menu')"><span data-i="back"></span></button>
 </div>

 <div class="scr" id="s-ad" style="background:#14101f">
  <div class="ttl" style="font-size:2rem" data-i="adT"></div>
  <div class="spin"></div>
  <div id="ad-count" class="ttl" style="font-size:3rem"></div>
  <p class="note" data-i="adNote"></p>
 </div>

 <div class="scr" id="s-over">
  <div id="over-icon" data-ic="fail"></div>
  <div class="ttl" id="over-title" style="font-size:2.2rem;color:#fecaca"></div>
  <p class="ttl" id="fail-blame" style="font-size:1.1rem;margin:0"></p>
  <div class="pill"><span data-ic="coin"></span><b id="over-coins">+0</b></div>
  <p id="score-line" class="note"></p>
  <div id="wheel"><b style="background:#f97316">x2</b><b style="background:#a855f7">x3</b><b style="background:#3b82f6">x4</b><b style="background:#22c55e">x5</b><i id="ptr"></i></div>
  <button class="btn y" id="btn-claim" onclick="claimWheel()"><span data-ic="ad"></span><span data-i="claim"></span></button>
  <button class="btn g" id="btn-again" onclick="playAgain()"><span id="again-txt"></span></button>
  <p class="note" id="again-wait" style="display:none" data-i="wait"></p>
  <button class="btn k" onclick="leaveMenu()"><span data-i="leave"></span></button>
 </div>
</div>

<script type="module">
// Polyfill: older iOS Safari (before 16) has no ctx.roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(typeof r==='number'?r:0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- ICONS (drawn, no emoji) ----------
const IC={
coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#f6c92d" stroke="#d49a12" stroke-width="1.5"/><circle cx="12" cy="12" r="8" fill="none" stroke="#e3a816" stroke-width=".8"/><path d="M12 6.8L13.411 10.058L16.945 10.393L14.283 12.742L15.056 16.207L12 14.4L8.944 16.207L9.717 12.742L7.055 10.393L10.589 10.058Z" fill="#f08a1c" stroke="#ffc766" stroke-width=".6" stroke-linejoin="round"/></svg>',
ad:'<svg viewBox="0 0 24 24"><rect x="1.5" y="5.5" width="14" height="13" rx="3" fill="#fff"/><path d="M17 10.5l5.5-3.5v10L17 13.5z" fill="#fff"/></svg>',
gift:'<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2" fill="#ef4444"/><rect x="2" y="6.5" width="20" height="5" rx="2" fill="#f87171"/><rect x="10.5" y="6.5" width="3" height="14.5" fill="#fde047"/><path d="M12 6.5C9 1.5 5 4.5 8.5 6.5zM12 6.5c3-5 7-2 3.5 0z" fill="#fde047"/></svg>',
fail:'<svg viewBox="0 0 120 120" width="110" height="110"><circle cx="60" cy="60" r="54" fill="#ef4444" stroke="#991b1b" stroke-width="6"/><path d="M38 38l16 16M54 38L38 54M66 38l16 16M82 38L66 54" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M40 88q20-22 40 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>',
check:'<svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path d="M12 21C5 15.5 2 12.2 2 8.6 2 5.9 4.1 4 6.6 4c1.9 0 3.6 1 5.4 3 1.8-2 3.5-3 5.4-3C19.9 4 22 5.9 22 8.6c0 3.6-3 6.9-10 12.4z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/><ellipse cx="7.5" cy="8" rx="1.8" ry="1.2" fill="#fff" opacity=".6"/></svg>',
heartOff:'<svg viewBox="0 0 24 24"><path d="M12 21C5 15.5 2 12.2 2 8.6 2 5.9 4.1 4 6.6 4c1.9 0 3.6 1 5.4 3 1.8-2 3.5-3 5.4-3C19.9 4 22 5.9 22 8.6c0 3.6-3 6.9-10 12.4z" fill="#6b7280" stroke="#374151" stroke-width="1.5" opacity=".6"/></svg>',
win:'<svg viewBox="0 0 120 120" width="110" height="110"><circle cx="60" cy="60" r="54" fill="#22c55e" stroke="#166534" stroke-width="6"/><path d="M60 24L71 49L98 52L78 70L84 97L60 83L36 97L42 70L22 52L49 49Z" fill="#fde047" stroke="#ca8a04" stroke-width="4" stroke-linejoin="round"/></svg>'};
document.querySelectorAll('[data-ic]').forEach(e=>{e.innerHTML=IC[e.dataset.ic]});
document.querySelectorAll('.spin').forEach(e=>{let h='';for(let i=0;i<12;i++)h+='<i style="transform:rotate('+i*30+'deg);animation-delay:'+(-1+i/12).toFixed(3)+'s"></i>';e.innerHTML=h});

// ---------- LANGUAGES ----------
const D={
en:{play:'PLAY',shop:'SHOP',daily:'DAILY GIFT',settings:'SETTINGS',nameQ:"What's your name?",nameNote:'This name will be saved and cannot be changed later.',nameHint:'Type your name',next:'CONTINUE',nameErr:'Type at least 2 characters.',single:'SINGLE PLAYER',multi:'MULTIPLAYER',back:'BACK',createRoom:'CREATE ROOM',joinRoom:'JOIN ROOM',hostT:'Create Room',giveCode:'Give this 4-character code to your friend:',players:'Players',start:'START GAME',cancel:'CANCEL',joinT:'Join Room',enterCode:'Enter the 4-character room code:',join:'JOIN',player:'Player',sound:'SOUND',vib:'VIBRATION',on:'ON',off:'OFF',lang:'LANGUAGE',langName:'ENGLISH',oops:'OOPS!',mistake:n=>n+' MADE A MISTAKE!',gates:'Gates',best:'Best',claim:'CLAIM BONUS',again:'PLAY AGAIN',leave:'MENU',wait:'Waiting for the host to restart...',remember:'REMEMBER THE ORDER!',level:'LEVEL',levelDone:'LEVEL COMPLETE',bonusDone:'BONUS COMPLETE',next:'NEXT LEVEL',total:'Total earned',bonus:'BONUS',rival:'Rival',you:'You',adT:'AD',adNote:'Test ad. The real ad will be added later.',equipped:'EQUIPPED',select:'SELECT',poor:'Not enough coins',ad50:'WATCH AD  +50',day:'DAY',claimGift:'CLAIM',comeBack:'Come back tomorrow',opening:'Opening room...',roomOpen:'Room is open! Waiting for your friend to enter the code...',connErr:'Connection error',oppIn:'Opponent connected! You can start the game.',badCode:'Please enter the 4-character room code.',connecting:'Connecting to room...',joined:'Joined! Waiting for the host to start...',notFound:'Connection error or room not found!',oppLeft:'Opponent left the room'},
tr:{play:'OYNA',shop:'MAĞAZA',daily:'GÜNLÜK HEDİYE',settings:'AYARLAR',nameQ:'İsmin ne?',nameNote:'Bu isim kaydedilecek ve sonradan değiştirilemeyecek.',nameHint:'İsmini yaz',next:'DEVAM',nameErr:'En az 2 karakter yaz.',single:'TEK OYUNCULU',multi:'ÇOK OYUNCULU',back:'GERİ',createRoom:'ODA KUR',joinRoom:'ODAYA KATIL',hostT:'Oda Kur',giveCode:'Arkadaşına bu 4 haneli kodu ver:',players:'Oyuncu',start:'OYUNU BAŞLAT',cancel:'İPTAL',joinT:'Odaya Katıl',enterCode:'4 haneli oda kodunu gir:',join:'KATIL',player:'Oyuncu',sound:'SES',vib:'TİTREŞİM',on:'AÇIK',off:'KAPALI',lang:'DİL',langName:'TÜRKÇE',oops:'UPS!',mistake:n=>n+' HATA YAPTI!',gates:'Kapı',best:'En iyi',claim:'BONUSU AL',again:'TEKRAR OYNA',leave:'MENÜ',wait:'Kurucunun yeniden başlatması bekleniyor...',remember:'SIRAYI HATIRLA!',level:'BÖLÜM',levelDone:'BÖLÜM TAMAMLANDI',bonusDone:'BONUS TAMAMLANDI',next:'SONRAKİ BÖLÜM',total:'Toplam kazanç',bonus:'BONUS',rival:'Rakip',you:'Sen',adT:'REKLAM',adNote:'Test reklamı. Gerçek reklam sonra eklenecek.',equipped:'SEÇİLİ',select:'SEÇ',poor:'Yeterli altının yok',ad50:'REKLAM İZLE  +50',day:'GÜN',claimGift:'AL',comeBack:'Yarın tekrar gel',opening:'Oda açılıyor...',roomOpen:'Oda açıldı! Arkadaşının kodu girmesi bekleniyor...',connErr:'Bağlantı hatası',oppIn:'Rakip bağlandı! Oyunu başlatabilirsin.',badCode:'Lütfen 4 haneli oda kodunu gir.',connecting:'Odaya bağlanılıyor...',joined:'Odaya girildi! Kurucunun başlatması bekleniyor...',notFound:'Bağlantı hatası veya oda bulunamadı!',oppLeft:'Rakip odadan ayrıldı'}};
let lang=store.get('kado_lang','');
if(lang!=='tr'&&lang!=='en')lang=(navigator.language||'en').toLowerCase().indexOf('tr')===0?'tr':'en';
const t=(k,...a)=>{const L=D[lang]||D.en;const v=L[k]!==undefined?L[k]:D.en[k];return typeof v==='function'?v(...a):v};

// ---------- SAVED DATA ----------
const cleanName=n=>String(n||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,12);
let savedName=cleanName(store.get('kado_name',''));
let soundOn=store.get('kado_sound','1')==='1',vibOn=store.get('kado_vib','1')==='1';
let coins=+store.get('kado_coins','0')||0;
let level=+store.get('kado_level','1')||1; // current solo level; every 5th level is a bonus level
const SKINS=[{b:0xf4f6fb,e:0x1a2233,r:0x7c86a0,p:0,eye:0},{b:0x4a1a14,e:0x7a2a00,r:0xff9a2e,p:150,eye:1},{b:0x2f86b0,e:0x0d4a6a,r:0x8cf0ff,p:150,eye:1},{b:0x2c6a2c,e:0x1f5a10,r:0xa6ff4a,p:200,eye:1},{b:0x1a1428,e:0x3a1a6a,r:0xb88cff,p:300,eye:1},{b:0xd0467f,e:0x5a1030,r:0xffc0e4,p:400,eye:1},{b:0xd9a21a,e:0x6a4a00,r:0xfff2a8,p:500,eye:0,m:.7},{b:-1,r:-1,p:1000,eye:1}]; // b=body r=rim glow, b:-1 = rainbow
let owned;try{owned=JSON.parse(store.get('kado_owned','[0]'));if(!Array.isArray(owned))owned=[0]}catch(e){owned=[0]}
let skin=+store.get('kado_skin','0')||0;if(!owned.includes(skin)||!SKINS[skin])skin=0;
let lastClaim=store.get('kado_gdate',''),streak=+store.get('kado_gstreak','0')||0;

// ---------- UI HELPERS ----------
let audioCtx=null,cur='s-splash';

// ---------- MULTIPLAYER (P2P) ----------
let peer=null,conn=null,isMulti=false,isHost=false,myName='',oppName='',oppX=0,oppZ=0,oppState='START',oppSkin=0,round=0,seed=1;
function showHost(){myName=savedName;updateLabel(playerLabel,myName,'#fff');setScreen('s-host');createRoom()}
function showJoin(){myName=savedName;updateLabel(playerLabel,myName,'#fff');$('join-status').textContent='';$('join-spin').style.display='none';setScreen('s-join')}
function backToStart(){if(peer){peer.destroy();peer=null}conn=null;isMulti=false;isHost=false;setScreen('s-multi')}
function createRoom(){
 const code=Math.random().toString(36).substring(2,6).toUpperCase();
 $('host-code').textContent=code;$('host-cap').textContent=t('players')+': 1/2';$('btn-start').style.display='none';$('host-status').textContent=t('opening');$('host-spin').style.display='block';
 isMulti=true;isHost=true;if(peer)peer.destroy();
 peer=new Peer('moodrun-p2p-'+code);
 peer.on('open',()=>{$('host-status').textContent=t('roomOpen')});
 peer.on('error',e=>{if(e.type==='unavailable-id')createRoom();else{$('host-status').textContent=t('connErr')+': '+e.type;$('host-spin').style.display='none'}});
 peer.on('connection',c=>{
  if(conn&&conn.open){c.close();return} // room is full
  conn=c;$('host-cap').textContent=t('players')+': 2/2';$('host-status').textContent=t('oppIn');$('host-spin').style.display='none';$('btn-start').style.display='flex';
  setupConn(c);c.on('open',()=>{c.send({type:'join',name:myName,skin})});
 });
}
function joinByCode(){
 const code=$('join-code').value.trim().toUpperCase();
 if(code.length!==4){toast(t('badCode'));return}
 isMulti=true;isHost=false;round=0;$('join-status').textContent=t('connecting');$('join-spin').style.display='block';
 if(peer)peer.destroy();peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('moodrun-p2p-'+code,{reliable:true});setupConn(conn);conn.on('open',()=>{$('join-status').textContent=t('joined');$('join-spin').style.display='none';conn.send({type:'join',name:myName,skin})})});
 peer.on('error',()=>{$('join-status').textContent=t('notFound');$('join-spin').style.display='none'});
}
function setupConn(c){
 c.on('data',d=>{
  if(!d||typeof d!=='object')return;
  if(d.type==='join'){oppName=cleanName(d.name)||t('rival');updateLabel(oppLabel,oppName,'#fde047');if(Number.isInteger(d.skin)&&d.skin>=0&&d.skin<SKINS.length){oppSkin=d.skin;applyOppSkin()}}
  else if(d.type==='start'){if(!isHost&&Number.isInteger(d.seed)&&Number.isInteger(d.round))startRound(d.seed,d.round)}
  else if(d.type==='sync'){
   if(!Number.isFinite(d.x)||!Number.isFinite(d.z)||!Number.isInteger(d.rd)||!['START','PLAYING','GAMEOVER'].includes(d.st))return;
   if(!isHost&&d.st==='PLAYING'&&d.rd>round&&Number.isInteger(d.sd))startRound(d.sd,d.rd); // guest joins a round it missed
   if(d.rd!==round)return;
   oppX=Math.max(-BND,Math.min(BND,d.x));oppZ=d.z;oppState=d.st;
  }
  else if(d.type==='gameover'){if(d.rd===round)handleGameOver(cleanName(d.blame)||t('rival'))}
 });
 c.on('close',()=>toast(t('oppLeft'),5000));
}
function startRound(s,r){if(r<=round)return;round=r;seed=s;mode=isMulti?'endless':(level%5===0?'bonus':'level');diffBase=mode==='level'?(level-1)*LEVEL_ROUNDS:0;resetWorld();setScreen(null);state='PLAYING';if(isMulti){opp.position.set(0,0,0);oppX=0;oppZ=0;oppState='PLAYING'}else opp.position.set(0,-100,500)}
function startMultiplayer(){if(!isHost||!conn||!conn.open)return;const s=Math.floor(Math.random()*1e9);startRound(s,round+1);conn.send({type:'start',seed:s,round})}
function startSolo(){isMulti=false;myName=savedName;updateLabel(playerLabel,myName,'#fff');startRound(Math.floor(Math.random()*1e9),round+1)}
function playAgain(){if(!isMulti)startSolo();else if(isHost)startMultiplayer()}
function leaveMenu(){if(peer){peer.destroy();peer=null}conn=null;isMulti=false;isHost=false;clearWorld();pBody.rotation.set(0,0,0);pBody.position.y=0;player.position.set(0,0,0);opp.position.set(0,-100,500);state='START';setScreen('s-menu')}
function showEnd(win,name){
 const bonus=mode==='bonus';
 if(win){if(mode==='level')runCoins+=20;level++;store.set('kado_level',String(level))}
 addCoins(runCoins);
 $('over-icon').innerHTML=win?IC.win:IC.fail;
 $('over-title').textContent=t(win?(bonus?'bonusDone':'levelDone'):'oops');$('over-title').style.color=win?'#bbf7d0':'#fecaca';
 $('fail-blame').textContent=win?'':t('mistake',name);
 const best=Math.max(score,+store.get('kado_best','0')||0);store.set('kado_best',String(best));
 $('score-line').textContent=win?t('total')+': '+runCoins:t('gates')+': '+score+'     '+t('best')+': '+best;
 $('over-coins').textContent='+'+runCoins;
 $('again-txt').textContent=t(win?'next':'again');
 const guest=isMulti&&!isHost,has=runCoins>0;
 $('btn-again').style.display=guest?'none':'flex';$('again-wait').style.display=guest?'block':'none';
 $('btn-claim').disabled=false;$('btn-claim').style.display=has?'flex':'none';$('wheel').style.display=has?'flex':'none';
 setScreen('s-over');
}
function handleGameOver(name){if(state==='GAMEOVER')return;state='GAMEOVER';dragging=false;showEnd(false,name);beep(180,.3);buzz(200)}
function renderMap(){const base=Math.floor((level-1)/5)*5+1;let h='';for(let i=0;i<5;i++){const L=base+i,cl=L<level?' done':L===level?' cur':'',bn=L%5===0;h+=(i?'<span class="ln"></span>':'')+'<div class="nd'+cl+(bn?' bn':'')+'">'+(bn?IC.coin:L)+'</div>'}$('lvl-map').innerHTML=h}
function updateHearts(){$('hearts').innerHTML=(isMulti||mode!=='level')?'':[0,1,2].map(i=>i<lives?IC.heart:IC.heartOff).join('')}

// ---------- 3D ENGINE ----------
const FACES=['smile','neutral','sad'],FCOL={smile:0xf0323c,sad:0x2f6df0,neutral:0xffc914};
const LW=3.2,BND=LW*1.1,P=6.4,TL=512;
const GAP0=2,GAP_STEP=.1,GAP_MIN=1.2,V0=36,V_STEP=1.2,V_MAX=50; // gate gaps: 2.0s, 1.9s, 1.8s ... down to 1.2s
const LEVEL_ROUNDS=2,BONUS_TIME=7,BONUS_V=45; // a level = 2 rounds of 3 gates; every 5th level is a 7 second gold bonus
let scene,camera,renderer,trackTex,platform,player,pBody,pAL,pAR,pLL,pRL,pM,opp,oBody,oAL,oAR,oLL,oRL,oM,playerLabel,oppLabel;
let faceCv={},faceW={},faceMats={},frameMats={},glassMats={},gGeo,gGlass,gCard,gFoot,gShadow,shineMat,shadowMat,bGeo,pGeo,pMats,coinGeo,coinMat,finishObj=null;
let gates=[],boards=[],parts=[],coinsW=[],deco=[],shooters=[],stars=[],sparks=[];
let state='START',mode='level',diffBase=0,speed=V0/60,loopCount=1,runTime=0,oRun=0,targetX=0,dragging=false,prevPX=0,spawned=0,curLoop=0,seqIdx=0,score=0,runCoins=0,lives=3,lvPassed=0,bonusT=0,bonusRow=0,finishZ=-1e9,winT=0,winShown=false,shake=0,lastSync=0,lastFrame=0;
const loops=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const tx=new THREE.CanvasTexture(c);if(rep){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rep[0],rep[1])}tx.anisotropy=4;return tx}
function rr(p,x,y,w,h,r){p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y)}
function drawFace(g,type,col){g.lineWidth=35;g.lineCap='round';g.strokeStyle=g.fillStyle=col;g.beginPath();g.arc(170,200,25,0,7);g.fill();g.beginPath();g.arc(342,200,25,0,7);g.fill();g.beginPath();if(type==='smile')g.arc(256,260,110,.1*Math.PI,.9*Math.PI);else if(type==='sad')g.arc(256,390,110,1.1*Math.PI,1.9*Math.PI);else{g.moveTo(160,310);g.lineTo(352,310)}g.stroke()}
function makeLabel(text,color){const c=document.createElement('canvas');c.width=256;c.height=64;const tx=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false}));s.scale.set(4,1,1);s.position.y=3.9;s.userData={c,tx};updateLabel(s,text,color);return s}
function updateLabel(s,text,color){const g=s.userData.c.getContext('2d');g.clearRect(0,0,256,64);g.font="600 34px Fredoka,'Varela Round',sans-serif";g.textAlign='center';g.lineWidth=6;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(text,128,46);g.fillStyle=color;g.fillText(text,128,46);s.userData.tx.needsUpdate=true}
function skinTo(M,s,hue){if(s.b<0){M.mat.color.setHSL(hue,.8,.5);M.mat.emissive.setHSL(hue,.8,.22);M.out.color.setHSL((hue+.5)%1,.9,.7)}else{M.mat.color.setHex(s.b);M.mat.emissive.setHex(s.e);M.out.color.setHex(s.r)}M.mat.metalness=s.m||.05}
function applySkin(){if(pM)skinTo(pM,SKINS[skin],0)}
function applyOppSkin(){if(oM)skinTo(oM,SKINS[oppSkin],0)}
function scatter(m,z,k){m.position.x=(Math.random()<.5?-1:1)*(k==='c'?14+Math.random()*50:10+Math.random()*34);m.userData.y=k==='c'?-14+Math.random()*42:3+Math.random()*19;m.position.y=m.userData.y;m.position.z=z}

// Deterministic levels: same seed + same round number = same faces on every device
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function getLoopData(k){const rng=mulberry32((seed+k*7919)>>>0),sequence=[],rows=[];for(let i=0;i<3;i++){sequence.push(FACES[Math.floor(rng()*3)]);const r=[...FACES];for(let j=2;j>0;j--){const q=Math.floor(rng()*(j+1));[r[j],r[q]]=[r[q],r[j]]}rows.push(r)}return{sequence,gates:rows}}
function loopInfo(k){while(loops.length<=k){const i=loops.length,d=diffBase+i,start=i?loops[i-1].end:0,v=Math.min(V_MAX,V0+V_STEP*d),gap=n=>Math.max(GAP_MIN,GAP0-GAP_STEP*(3*d+n))*v,board=start-(i?1.5:3)*v,g1=board-gap(0),g2=g1-gap(1),g3=g2-gap(2);loops.push({start,v,board,g:[g1,g2,g3],end:g3})}return loops[k]}
function spawnLoop(k){const d=getLoopData(k),L=loopInfo(k);spawnBoard(L.board,d);L.g.forEach((z,j)=>spawnGateRow(z,j,d));spawnCoinLine(L.board,L.g[0]);spawnCoinLine(L.g[0],L.g[1]);spawnCoinLine(L.g[1],L.g[2])}
// "Remember the order" board: original design (blue panel, white faces, yellow arrows)
function spawnBoard(zPos,data){
 const tx=canvasTex(1024,512,ctx=>{
  ctx.fillStyle='rgba(30, 58, 138, 0.95)';ctx.beginPath();ctx.roundRect(10,10,1004,492,40);ctx.fill();ctx.lineWidth=15;ctx.strokeStyle='#60a5fa';ctx.stroke();
  ctx.fillStyle='#ffffff';ctx.font='600 70px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText(t('remember'),512,120);
  const startX=180,spacing=330;
  data.sequence.forEach((face,i)=>{ctx.drawImage(faceW[face],startX+i*spacing-100,180,200,200);
   if(i<2){const ax=startX+i*spacing+135;ctx.strokeStyle='#facc15';ctx.fillStyle='#facc15';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax,300);ctx.lineTo(ax+38,300);ctx.stroke();ctx.beginPath();ctx.moveTo(ax+30,278);ctx.lineTo(ax+62,300);ctx.lineTo(ax+30,322);ctx.fill()}});
 });
 const b=new THREE.Mesh(bGeo,new THREE.MeshBasicMaterial({map:tx,transparent:true}));b.position.set(0,6,zPos);scene.add(b);boards.push(b);
}
function killBoard(b){scene.remove(b);b.material.map.dispose();b.material.dispose()}
function spawnGateRow(z,j,data){
 const row=new THREE.Group();row.position.z=z;row.userData={passed:false,seq:j,req:data.sequence[j]};
 data.gates[j].forEach((face,i)=>{
  const x=(i-1)*LW,fm=frameMats[face];
  const fr=new THREE.Mesh(gGeo,fm);fr.position.x=x;
  const gl=new THREE.Mesh(gGlass,glassMats[face]);gl.position.set(x,2.05,0);gl.userData={isGate:true,face,laneX:x};
  const cd=new THREE.Mesh(gCard,faceMats[face]);cd.position.set(x,2.05,.12);
  const sn=new THREE.Mesh(gGlass,shineMat);sn.position.set(x,2.05,.16);
  const f1=new THREE.Mesh(gFoot,fm),f2=new THREE.Mesh(gFoot,fm);f1.position.set(x-1,0,0);f2.position.set(x+1,0,0);
  const sd=new THREE.Mesh(gShadow,shadowMat);sd.rotation.x=-Math.PI/2;sd.position.set(x,.03,0);
  row.add(fr,gl,cd,sn,f1,f2,sd);
 });
 scene.add(row);gates.push(row);
}
function spawnCoinLine(z1,z2){const x=(Math.floor(Math.random()*3)-1)*LW;for(let i=0;i<4;i++){const c=new THREE.Mesh(coinGeo,coinMat);c.position.set(x,1.1,z1+(z2-z1)*(.3+.13*i));c.userData={ph:Math.random()*6,v:1};scene.add(c);coinsW.push(c)}}
function spawnBonusRow(z,i){const c8=i%8,lanes=c8<5?[0,1,2]:[c8-5];lanes.forEach(l=>{const c=new THREE.Mesh(coinGeo,coinMat);c.position.set((l-1)*LW,1.1,z);c.userData={ph:Math.random()*6,v:2};scene.add(c);coinsW.push(c)})}
function makeFinish(z){
 const g=new THREE.Group(),ck=canvasTex(128,32,(c)=>{for(let x=0;x<16;x++)for(let y=0;y<4;y++){c.fillStyle=(x+y)%2?'#111':'#fff';c.fillRect(x*8,y*8,8,8)}}),m=new THREE.MeshBasicMaterial({map:ck});
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(LW*3,3),m);fl.rotation.x=-Math.PI/2;fl.position.y=.04;
 const bn=new THREE.Mesh(new THREE.PlaneGeometry(LW*3+1.4,1.5),m);bn.position.y=5.2;
 const pm=new THREE.MeshStandardMaterial({color:0xe53935,roughness:.3}),pg=new THREE.CylinderGeometry(.3,.3,5.9,14);
 const p1=new THREE.Mesh(pg,pm),p2=new THREE.Mesh(pg,pm);p1.position.set(-(LW*1.5+.7),2.95,0);p2.position.set(LW*1.5+.7,2.95,0);
 g.add(fl,bn,p1,p2);g.position.z=z;scene.add(g);finishObj=g;
