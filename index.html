<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Run 3D - KADO Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Varela+Round&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #0f172a; font-family: 'Varela Round', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(12px);
            transition: opacity 0.3s; opacity: 0; visibility: hidden;
        }
        .screen.active { opacity: 1; visibility: visible; }

        .game-title {
            font-family: 'Fredoka One', cursive; text-shadow: 0 6px 15px rgba(0,0,0,0.6);
            font-size: 3.8rem; line-height: 1.1; text-align: center; color: white;
        }

        .btn {
            font-family: 'Fredoka One', cursive; border: none; color: white; padding: 16px 28px;
            font-size: 18px; border-radius: 30px; cursor: pointer;
            transition: transform 0.1s, filter 0.2s; text-transform: uppercase; pointer-events: auto;
            width: 100%; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn:active { transform: translateY(4px); }
        .btn:disabled { filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; transform: none; }

        .input-field {
            padding: 14px 20px; border-radius: 20px; border: 3px solid #38bdf8;
            font-size: 20px; font-weight: bold; text-align: center; width: 100%;
            outline: none; color: #0f172a; margin-bottom: 12px; background: rgba(255,255,255,0.95);
        }

        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 20;
        }
        .top-btn {
            background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
            border: 2px solid white; color: white; border-radius: 20px;
            padding: 8px 16px; font-weight: bold; pointer-events: auto; cursor: pointer;
            font-family: 'Fredoka One', cursive; font-size: 16px;
        }
        .coin-box {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
            border: 3px solid #fef3c7; border-radius: 20px; padding: 8px 20px;
            font-family: 'Fredoka One', cursive; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
        }

        .progress-bar-container {
            width: 80%; max-width: 400px; height: 18px; margin: 0 auto;
            background: rgba(0,0,0,0.5); border-radius: 10px;
            border: 3px solid rgba(255,255,255,0.8); display: none; pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); overflow: hidden;
        }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #34d399, #10b981); transition: width 0.3s ease-out; }

        /* Skin Card */
        .skin-card {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 20px; padding: 15px; text-align: center; width: 45%;
            margin-bottom: 15px; position: relative;
        }
        .skin-card.equipped { border-color: #4ade80; background: rgba(74, 222, 128, 0.2); }
        .skin-color-preview { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px auto; border: 3px solid white; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3); }

        /* Ad Overlay */
        #ad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: none; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto;
        }
        .ad-loader { width: 60px; height: 60px; border: 6px solid #333; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom SVGs */
        .svg-icon { width: 24px; height: 24px; fill: currentColor; }
        .big-icon { width: 80px; height: 80px; fill: #ef4444; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="game-container"></div>
    
    <div class="top-bar">
        <div>
            <button class="top-btn" id="btn-lang" onclick="toggleLang()" style="margin-bottom: 8px;">EN</button>
            <div id="ingame-hud" style="display:none;">
                <div class="progress-bar-container" id="progress-container" style="display:block; margin:0;">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>
        <div class="coin-box">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fbbf24" stroke="#fff" stroke-width="2"/><text x="12" y="16" font-size="12" font-family="Arial" font-weight="bold" fill="#fff" text-anchor="middle">$</text></svg>
            <span id="coin-amount">0</span>
        </div>
    </div>
    
    <div id="ui-layer">
        
        <!-- Main Menu -->
        <div class="screen active" id="screen-menu">
            <h1 class="game-title mb-2">MOOD<br><span class="text-sky-400">RUN</span></h1>
            <p class="text-white/80 font-bold mb-8 tracking-widest text-lg">KADO GAMES</p>
            <div class="flex flex-col gap-4 w-72">
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="onPlay()"><span data-tr="OYNA" data-en="PLAY">PLAY</span></button>
                <button class="btn bg-purple-500 shadow-[0_6px_0_#4c1d95]" onclick="openShop()"><span data-tr="MARKET" data-en="SHOP">SHOP</span></button>
                <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="openSettings()"><span data-tr="AYARLAR" data-en="SETTINGS">SETTINGS</span></button>
            </div>
        </div>

        <!-- Shop / Skins -->
        <div class="screen" id="screen-shop">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="MARKET" data-en="SHOP">SHOP</h2>
            <div class="w-80 max-h-[60%] overflow-y-auto flex flex-wrap justify-between" id="skin-list">
                <!-- Populated by JS -->
            </div>
            <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] w-72 mt-6" onclick="setScreen('screen-menu')"><span data-tr="GERİ" data-en="BACK">BACK</span></button>
        </div>

        <!-- Daily Reward -->
        <div class="screen" id="screen-daily">
            <div class="bg-white/10 p-8 rounded-3xl border border-white/20 w-80 backdrop-blur-md text-center shadow-2xl">
                <svg class="w-20 h-20 mx-auto mb-4 fill-yellow-400 drop-shadow-lg" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-3-3c-1.08 0-2 .57-2.5 1.43C11.96 2.57 11.08 2 10 2a3 3 0 0 0-3 3c0 .35.07.69.18 1H5c-1.11 0-2 .89-2 2v2c0 1.11.89 2 2 2v9c0 1.11.89 2 2 2h10c1.11 0 2-.89 2-2v-9c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM10 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 2c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zM5 8h14v2H5V8zm12 10H7v-8h10v8z"/></svg>
                <h2 class="text-3xl font-black text-white mb-2" data-tr="GÜNLÜK ÖDÜL" data-en="DAILY REWARD">DAILY REWARD</h2>
                <p class="text-white/80 font-bold mb-6">+50 Coins!</p>
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="claimDaily()"><span data-tr="AL" data-en="CLAIM">CLAIM</span></button>
            </div>
        </div>

        <!-- Name -->
        <div class="screen" id="screen-name">
            <h2 class="text-3xl font-black text-white mb-2 text-center" data-tr="İsmin ne?" data-en="Your Name?">Your Name?</h2>
            <div class="w-72 mt-4">
                <input type="text" id="name-input" class="input-field" maxlength="12" autocomplete="off">
                <p id="name-error" class="text-yellow-300 text-sm font-bold text-center h-5 mb-2"></p>
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="saveName()"><span data-tr="DEVAM" data-en="CONTINUE">CONTINUE</span></button>
            </div>
        </div>

        <!-- Mode -->
        <div class="screen" id="screen-mode">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="OYNA" data-en="PLAY">PLAY</h2>
            <div class="flex flex-col gap-4 w-72">
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="startSolo()"><span data-tr="TEK OYUNCULU" data-en="SINGLEPLAYER">SINGLEPLAYER</span></button>
                <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="setScreen('screen-multi')"><span data-tr="ÇOK OYUNCULU" data-en="MULTIPLAYER">MULTIPLAYER</span></button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151]" onclick="setScreen('screen-menu')"><span data-tr="GERİ" data-en="BACK">BACK</span></button>
            </div>
        </div>

        <!-- Multiplayer -->
        <div class="screen" id="screen-multi">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="ÇOK OYUNCULU" data-en="MULTIPLAYER">MULTIPLAYER</h2>
            <div class="flex flex-col gap-4 w-72">
                <button class="btn bg-sky-500 shadow-[0_6px_0_#0284c7]" onclick="showHostMenu()"><span data-tr="ODA KUR" data-en="CREATE ROOM">CREATE ROOM</span></button>
                <button class="btn bg-emerald-500 shadow-[0_6px_0_#059669]" onclick="showJoinMenu()"><span data-tr="ODAYA KATIL" data-en="JOIN ROOM">JOIN ROOM</span></button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151]" onclick="setScreen('screen-mode')"><span data-tr="GERİ" data-en="BACK">BACK</span></button>
            </div>
        </div>

        <!-- Settings -->
        <div class="screen" id="screen-settings">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="AYARLAR" data-en="SETTINGS">SETTINGS</h2>
            <div class="flex flex-col gap-4 w-72">
                <button id="btn-sound" class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="toggleSetting('sound')"></button>
                <button id="btn-vib" class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="toggleSetting('vib')"></button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151]" onclick="setScreen('screen-menu')"><span data-tr="GERİ" data-en="BACK">BACK</span></button>
            </div>
        </div>

        <!-- Host Room -->
        <div class="screen" id="screen-host">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="ODA KUR" data-en="CREATE ROOM">CREATE ROOM</h2>
            <div class="bg-white/20 p-6 rounded-3xl border border-white/30 text-center w-80 backdrop-blur-sm">
                <p class="text-white/90 font-bold mb-2" data-tr="Kodu arkadaşına ver:" data-en="Give code to friend:">Give code to friend:</p>
                <h3 id="host-room-code" class="text-5xl font-black text-yellow-400 tracking-widest mb-4 drop-shadow-md">...</h3>
                <div id="host-capacity" class="bg-black/40 rounded-full py-2 px-4 inline-block text-white font-bold mb-4">1/2</div>
                <button id="btn-start-mp" class="btn bg-green-500 shadow-[0_6px_0_#166534] mt-2 w-full hidden" onclick="startMultiplayer()"><span data-tr="BAŞLAT!" data-en="START!">START!</span></button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-3 w-full" onclick="backToStart()"><span data-tr="İPTAL" data-en="CANCEL">CANCEL</span></button>
            </div>
            <p id="host-status" class="text-white mt-4 font-bold text-center h-6" data-tr="Bekleniyor..." data-en="Waiting...">Waiting...</p>
        </div>

        <!-- Join Room -->
        <div class="screen" id="screen-join">
            <h2 class="text-3xl font-black text-white mb-6" data-tr="KATIL" data-en="JOIN">JOIN</h2>
            <div class="bg-white/10 p-6 rounded-3xl border border-white/20 w-80 backdrop-blur-sm">
                <input type="text" id="manual-join-code" placeholder="CODE" class="input-field !mb-6 uppercase text-3xl tracking-widest text-center" maxlength="4">
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d] w-full" onclick="joinByCode()"><span data-tr="GİRİŞ YAP" data-en="ENTER">ENTER</span></button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-3 w-full" onclick="backToStart()"><span data-tr="GERİ" data-en="BACK">BACK</span></button>
            </div>
            <p id="join-status" class="text-yellow-300 mt-4 font-bold text-center h-6"></p>
        </div>

        <!-- Game Over -->
        <div class="screen" id="screen-gameover">
            <div class="bg-white px-8 py-6 rounded-3xl text-center mb-6 shadow-2xl w-80">
                <!-- Custom Loss Icon instead of skull emoji -->
                <svg class="big-icon mx-auto" viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
                <h1 class="font-black text-3xl text-red-600 uppercase tracking-wider mb-2" data-tr="YANLIŞ KAPI!" data-en="WRONG GATE!">WRONG GATE!</h1>
                <p id="fail-blame" class="text-slate-800 font-bold text-lg mb-2"></p>
                <div class="bg-slate-100 rounded-xl p-3">
                    <p id="score-line" class="text-slate-700 font-bold"></p>
                    <p class="text-yellow-600 font-bold mt-1 text-sm">+<span id="earned-coins">0</span> Coins</p>
                </div>
            </div>
            <div class="flex flex-col gap-4 w-80">
                <!-- Ad Revive Button -->
                <button class="btn bg-sky-500 shadow-[0_6px_0_#0284c7]" id="btn-revive" onclick="watchAdRevive()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 8v8l5-4-5-4zm9-5H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                    <span data-tr="DEVAM ET" data-en="REVIVE">REVIVE</span>
                </button>
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" id="btn-again" onclick="playAgain()"><span data-tr="YENİDEN OYNA" data-en="PLAY AGAIN">PLAY AGAIN</span></button>
                <p id="again-wait" class="text-white font-bold text-center" style="display:none" data-tr="Kurucu bekleniyor..." data-en="Waiting for host...">Waiting for host...</p>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151]" onclick="resetGame()"><span data-tr="MENÜYE DÖN" data-en="MAIN MENU">MAIN MENU</span></button>
            </div>
        </div>
    </div>

    <!-- Ad Loading Overlay -->
    <div id="ad-overlay">
        <div class="ad-loader mb-6"></div>
        <h2 class="text-2xl font-black text-white" data-tr="REKLAM İZLENİYOR..." data-en="WATCHING AD...">WATCHING AD...</h2>
        <p class="text-white/60 font-bold mt-2" data-tr="Lütfen bekleyin" data-en="Please wait">Please wait</p>
    </div>

<script type="module">
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2);
            this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
        };
    }

    const FACES = ['smile', 'neutral', 'sad'];
    const LANE_WIDTH = 3.2; 
    const BOUNDARY = LANE_WIDTH * 1.1; 
    const LOOP_LEN = 280; // Shorter distance for faster pacing
    
    let scene, camera, renderer, track;
    let trackTexture; // For infinite scrolling illusion
    let player, playerBody, leftLeg, rightLeg;
    let opponent, oppBody, oppLeftLeg, oppRightLeg;
    let playerLabel, oppLabel;
    
    let gates = [], memoryBoards = [], particles = [], scenery = [];
    let state = 'START'; 
    let speed = 0.8; // Faster initial speed
    let loopCount = 1, sessionCoins = 0;
    let runTime = 0, oppRunTime = 0;
    let targetX = 0, isDragging = false, previousPointerX = 0;

    let seed = 1, spawnedLoops = 0, currentLoopIdx = 0;
    let currentSequenceIndex = 0;

    // P2P State
    let peer = null, conn = null;
    let isMultiplayer = false, isHost = false;
    let oppTargetX = 0, oppTargetZ = 500, oppState = 'START';
    let myName = "Player 1", oppName = "Player 2";
    let lastSync = 0, round = 0;

    const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    // --- I18N (Language) ---
    let lang = store.get('kado_lang', 'TR');
    window.toggleLang = () => {
        lang = lang === 'TR' ? 'EN' : 'TR';
        store.set('kado_lang', lang);
        updateLangUI();
    };
    function updateLangUI() {
        document.getElementById('btn-lang').innerText = lang;
        document.querySelectorAll('[data-tr]').forEach(el => {
            el.innerText = lang === 'TR' ? el.getAttribute('data-tr') : el.getAttribute('data-en');
        });
        refreshSettings();
        populateShop();
    }

    // --- Economy & Skins ---
    let coins = parseInt(store.get('kado_coins', '0'));
    let equippedSkin = store.get('kado_skin', 'red');
    const SKINS = [
        { id: 'red', color: '#ef4444', price: 0, nameTR: 'Kırmızı', nameEN: 'Red' },
        { id: 'blue', color: '#3b82f6', price: 100, nameTR: 'Mavi', nameEN: 'Blue' },
        { id: 'green', color: '#10b981', price: 250, nameTR: 'Yeşil', nameEN: 'Green' },
        { id: 'gold', color: '#fbbf24', price: 500, nameTR: 'Altın', nameEN: 'Gold' }
    ];

    function updateCoinsUI() {
        document.getElementById('coin-amount').innerText = coins;
        store.set('kado_coins', coins);
    }

    window.openShop = () => { populateShop(); setScreen('screen-shop'); }
    function populateShop() {
        const list = document.getElementById('skin-list');
        list.innerHTML = '';
        const owned = JSON.parse(store.get('kado_owned_skins', '["red"]'));
        SKINS.forEach(s => {
            const isOwned = owned.includes(s.id);
            const isEq = equippedSkin === s.id;
            let btnHtml = '';
            if (isEq) btnHtml = `<button class="btn bg-gray-500 w-full !text-sm !p-2" disabled>${lang==='TR'?'KUŞANILDI':'EQUIPPED'}</button>`;
            else if (isOwned) btnHtml = `<button class="btn bg-green-500 w-full !text-sm !p-2" onclick="equipSkin('${s.id}')">${lang==='TR'?'KUŞAN':'EQUIP'}</button>`;
            else btnHtml = `<button class="btn bg-blue-500 w-full !text-sm !p-2" onclick="buySkin('${s.id}')">${s.price} <svg class="svg-icon w-4 h-4 inline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fbbf24"/></svg></button>`;

            list.innerHTML += `
                <div class="skin-card ${isEq ? 'equipped' : ''}">
                    <div class="skin-color-preview" style="background:${s.color}"></div>
                    <p class="text-white font-bold mb-3">${lang==='TR'?s.nameTR:s.nameEN}</p>
                    ${btnHtml}
                </div>
            `;
        });
    }
    window.buySkin = (id) => {
        const skin = SKINS.find(x => x.id === id);
        if (coins >= skin.price) {
            coins -= skin.price; updateCoinsUI();
            const owned = JSON.parse(store.get('kado_owned_skins', '["red"]'));
            owned.push(id); store.set('kado_owned_skins', JSON.stringify(owned));
            equipSkin(id);
        } else {
            alert(lang==='TR'?"Yeterli altının yok!":"Not enough coins!");
        }
    }
    window.equipSkin = (id) => {
        equippedSkin = id; store.set('kado_skin', id);
        populateShop(); applySkinToPlayer();
    }

    // --- Core Data ---
    const cleanName = (n) => String(n || '').replace(/[^\p{L}\p{N} _.-]/gu, '').trim().slice(0, 12);
    let savedName = cleanName(store.get('kado_name', ''));
    let soundOn = store.get('kado_sound', '1') === '1';
    let vibOn = store.get('kado_vib', '1') === '1';
    let audioCtx = null;

    function beep(freq, dur) {
        if (!soundOn) return;
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = freq; g.gain.value = 0.08;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        } catch (e) {}
    }
    function buzz(ms) { if (vibOn && navigator.vibrate) navigator.vibrate(ms); }

    function refreshSettings() {
        document.getElementById('btn-sound').innerText = (lang==='TR'?'SES: ':'SOUND: ') + (soundOn ? (lang==='TR'?'AÇIK':'ON') : (lang==='TR'?'KAPALI':'OFF'));
        document.getElementById('btn-vib').innerText = (lang==='TR'?'TİTREŞİM: ':'VIBE: ') + (vibOn ? (lang==='TR'?'AÇIK':'ON') : (lang==='TR'?'KAPALI':'OFF'));
    }
    window.openSettings = () => { refreshSettings(); setScreen('screen-settings'); }
    window.toggleSetting = (k) => {

    window.createRoom = () => {
        const shortCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('host-room-code').innerText = shortCode;
        document.getElementById('host-capacity').innerText = "1/2";
        document.getElementById('btn-start-mp').classList.add('hidden');
        document.getElementById('host-status').innerText = lang==='TR'?"Oda açılıyor...":"Opening room...";
        
        isMultiplayer = true; isHost = true;
        if (peer) peer.destroy();

        peer.on('open', () => { document.getElementById('host-status').innerText = lang==='TR'?"Arkadaşını bekle...":"Waiting for friend..."; });
        peer.on('error', (err) => { if (err.type === 'unavailable-id') createRoom(); });
        peer.on('connection', (connection) => {

            document.getElementById('host-status').innerText = lang==='TR'?"Rakip bağlandı!":"Opponent connected!";

    window.joinByCode = () => {

        document.getElementById('join-status').innerText = lang==='TR'?"Bağlanıyor...":"Connecting...";
        if (peer) peer.destroy();
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(`kadorun-${code}`, { reliable: true });
            setupConnectionListeners(conn);
            conn.on('open', () => {
                document.getElementById('join-status').innerText = lang==='TR'?"Kurucu bekleniyor...":"Waiting for host...";
                conn.send({ type: 'join', name: myName, skin: equippedSkin });
            });

        peer.on('error', () => { document.getElementById('join-status').innerText = lang==='TR'?"Hata!":"Error!"; });

    function setupConnectionListeners(c) {
        c.on('data', (data) => {
            if (!data) return;
            if (data.type === 'join') {
                oppName = cleanName(data.name) || 'Rival';
                updateNameLabel(oppLabel, oppName);
                if(data.skin) applySkinToOpponent(data.skin);
            } else if (data.type === 'start') {
                if (!isHost) startRound(data.seed, data.round);
            } else if (data.type === 'sync') {
                if (!isHost && data.st === 'PLAYING' && data.rd > round) startRound(data.sd, data.rd);
                if (data.rd !== round) return;
                oppTargetX = Math.max(-BOUNDARY, Math.min(BOUNDARY, data.x)); oppTargetZ = data.z; oppState = data.st;
            } else if (data.type === 'gameover') {
                if (data.rd === round) handleGameOver(cleanName(data.blame) || 'Rival');
            } else if (data.type === 'revive') {
                if (data.rd === round) oppState = 'PLAYING';
            }
        });
    }

    function startRound(newSeed, newRound) {
        if (newRound <= round) return;
        round = newRound; seed = newSeed; sessionCoins = 0;

        resetPlayerAndWorld();
        setScreen(null);
        state = 'PLAYING';
        if (isMultiplayer) { opponent.position.set(0, 0, 0); oppTargetX = 0; oppTargetZ = 0; oppState = 'PLAYING'; }
        else opponent.position.set(0, -100, 500);
    }

    window.startMultiplayer = () => {
        if (!isHost || !conn || !conn.open) return;
        const s = Math.floor(Math.random() * 1e9);
        startRound(s, round + 1);
        conn.send({ type: 'start', seed: s, round: round });
    }

    window.startSolo = () => {
        isMultiplayer = false; myName = savedName;

    window.playAgain = () => {

    function createTrack() {
        // Dynamic Neon Texture instead of solid box
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0,0,0,1024);
        grad.addColorStop(0, '#1e293b'); grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad; ctx.fillRect(0,0,512,1024);
        // Neon lines
        ctx.fillStyle = '#0ea5e9';
        for(let i=0; i<1024; i+=128) { ctx.fillRect(0, i, 512, 10); } // Horizontal
        ctx.fillRect(100, 0, 10, 1024); ctx.fillRect(402, 0, 10, 1024); // Borders

        trackTexture = new THREE.CanvasTexture(canvas);
        trackTexture.wrapS = trackTexture.wrapT = THREE.RepeatWrapping;
        trackTexture.repeat.set(1, 100);

        const geometry = new THREE.PlaneGeometry(LANE_WIDTH * 3 + 4, 3000);
        const material = new THREE.MeshStandardMaterial({ map: trackTexture, roughness: 0.8 });
        track = new THREE.Mesh(geometry, material);
        track.rotation.x = -Math.PI / 2;
        track.position.set(0, 0.01, 0);
        track.receiveShadow = true;
        scene.add(track);

        // Ground base
        const baseGeo = new THREE.PlaneGeometry(200, 3000);
        const baseMat = new THREE.MeshBasicMaterial({color: 0x020617});
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.rotation.x = -Math.PI / 2;
        scene.add(base);
    }

    function createCharacterConfig() {
        const charGroup = new THREE.Group();
        const charBody = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }); 

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.0, 16), mat);
        torso.position.y = 1.4; torso.castShadow = true; charBody.add(torso);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), mat);
        head.position.y = 2.2; head.castShadow = true; charBody.add(head);
        const legGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
        const lLeg = new THREE.Mesh(legGeo, mat);
        lLeg.position.set(-0.18, 0.45, 0); lLeg.castShadow = true; charBody.add(lLeg);
        const rLeg = new THREE.Mesh(legGeo, mat);
        rLeg.position.set(0.18, 0.45, 0); rLeg.castShadow = true; charBody.add(rLeg);

        charGroup.add(charBody);
        return { root: charGroup, body: charBody, leftLeg: lLeg, rightLeg: rLeg, mat: mat };
    }

    // Custom Face Logic
    function drawCustomFace(ctx, type, isMemoryBoard) {
        ctx.fillStyle = isMemoryBoard ? 'transparent' : 'rgba(15, 23, 42, 0.9)';
        if(!isMemoryBoard) {
            ctx.beginPath(); ctx.roundRect(20, 20, 472, 472, 80); ctx.fill();
            ctx.lineWidth = 12; ctx.strokeStyle = '#38bdf8'; ctx.stroke();
        }

        ctx.lineWidth = 40; ctx.lineCap = 'round';
        ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
        
        ctx.beginPath(); ctx.arc(170, 180, 25, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(342, 180, 25, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath();
        if (type === 'smile') { ctx.arc(256, 260, 110, 0.1 * Math.PI, 0.9 * Math.PI); } 
        else if (type === 'sad') { ctx.arc(256, 390, 110, 1.1 * Math.PI, 1.9 * Math.PI); } 
        else if (type === 'neutral') { ctx.moveTo(160, 310); ctx.lineTo(352, 310); }
        ctx.stroke();
    }

    function createFaceTexture(type, isMemoryBoard = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        drawCustomFace(canvas.getContext('2d'), type, isMemoryBoard);
        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
    }

    function mulberry32(a) {
        return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function getLoopData(k) {
        const rng = mulberry32((seed + k * 7919) >>> 0);
        const sequence = [], rows = [];
        for (let i = 0; i < 3; i++) {
            sequence.push(FACES[Math.floor(rng() * FACES.length)]);
            const row = [...FACES];
            for (let j = 2; j > 0; j--) {
                const r = Math.floor(rng() * (j + 1));
                [row[j], row[r]] = [row[r], row[j]];
            }
            rows.push(row);
        }
        return { sequence, gates: rows };
    }

    function spawnLoop(k) {
        const data = getLoopData(k);
        const base = -k * LOOP_LEN;
        // Tighter pacing: board at -80, gates starting at -140
        spawnMemoryBoard(base - 70, data);
        spawnGateRow(base - 150, 0, data);
        spawnGateRow(base - 210, 1, data);
        spawnGateRow(base - 270, 2, data);
        spawnScenery(base);
    }

    function spawnScenery(zBase) {
        const matColors = [0x3b82f6, 0x8b5cf6, 0xec4899, 0x10b981];
        for(let i=0; i<4; i++) {
            const geo = new THREE.BoxGeometry(4+Math.random()*4, 10+Math.random()*20, 4+Math.random()*4);
            const mat = new THREE.MeshStandardMaterial({color: matColors[Math.floor(Math.random()*matColors.length)], roughness:0.2});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()>0.5?1:-1) * (15 + Math.random()*15), mesh.geometry.parameters.height/2, zBase - Math.random()*LOOP_LEN);
            scene.add(mesh); scenery.push(mesh);
        }
    }

    function spawnMemoryBoard(zPos, data) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)'; 
        ctx.beginPath(); ctx.roundRect(10, 10, 1004, 492, 40); ctx.fill();
        ctx.lineWidth = 15; ctx.strokeStyle = '#38bdf8'; ctx.stroke();

        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 70px "Fredoka One", sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(lang==='TR'?"SIRAYI HATIRLA!":"REMEMBER ORDER!", 512, 120);

        const startX = 180; const spacing = 330;
        data.sequence.forEach((face, index) => {
            const tempCanvas = document.createElement('canvas'); tempCanvas.width = 512; tempCanvas.height = 512;
            drawCustomFace(tempCanvas.getContext('2d'), face, true);
            ctx.drawImage(tempCanvas, startX + (index * spacing) - 100, 180, 200, 200);
            if(index < 2) {
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 80px sans-serif';
                ctx.fillText('→', startX + (index * spacing) + 165, 300);
            }
        });

        const tex = new THREE.CanvasTexture(canvas); tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const board = new THREE.Mesh(new THREE.PlaneGeometry(14, 7), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
        board.position.set(0, 6, zPos); scene.add(board); memoryBoards.push(board);
    }

    function spawnGateRow(zPos, seqIndex, data) {
        const row = new THREE.Group(); row.position.z = zPos;
        row.userData = { passed: false, seqIndex: seqIndex, required: data.sequence[seqIndex] };
        
        const rowFaces = data.gates[seqIndex];
        const gateWidth = LANE_WIDTH * 0.95; const gateHeight = 4.5;

        for(let i=0; i<3; i++) {
            const laneOffset = (i - 1) * LANE_WIDTH; 
            const faceType = rowFaces[i];

            // Colorful neon glass
            const mat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transmission: 0.8, transparent: true, opacity: 0.8, roughness: 0.1 });
            const gateMesh = new THREE.Mesh(new THREE.BoxGeometry(gateWidth, gateHeight, 0.4), mat);
            gateMesh.position.set(laneOffset, gateHeight/2, 0);

            // Neon Frame
            const frameMat = new THREE.MeshBasicMaterial({color: 0x0ea5e9});
            const fT = new THREE.Mesh(new THREE.BoxGeometry(gateWidth, 0.2, 0.5), frameMat); fT.position.set(laneOffset, gateHeight, 0);
            const fL = new THREE.Mesh(new THREE.BoxGeometry(0.2, gateHeight, 0.5), frameMat); fL.position.set(laneOffset - gateWidth/2, gateHeight/2, 0);
            const fR = new THREE.Mesh(new THREE.BoxGeometry(0.2, gateHeight, 0.5), frameMat); fR.position.set(laneOffset + gateWidth/2, gateHeight/2, 0);

            const texMesh = new THREE.Mesh(new THREE.PlaneGeometry(gateWidth * 0.7, gateWidth * 0.7), new THREE.MeshBasicMaterial({ map: createFaceTexture(faceType, false), transparent: true }));
            texMesh.position.set(laneOffset, gateHeight/2 + 0.3, 0.21); 

            row.add(gateMesh); row.add(fT); row.add(fL); row.add(fR); row.add(texMesh);
            gateMesh.userData = { faceType: faceType, isGate: true, laneX: laneOffset };
        }
        scene.add(row); gates.push(row);
    }

    function createParticles(position) {
        const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const colors = [0xfbbf24, 0x34d399, 0x38bdf8, 0xf472b6];
        for(let i=0; i<20; i++) {
            const mat = new THREE.MeshBasicMaterial({color: colors[Math.floor(Math.random()*colors.length)]});
            const p = new THREE.Mesh(geo, mat);
            p.position.copy(position); p.position.y += 2; p.position.x += (Math.random() - 0.5) * 3;
            p.userData = { vx: (Math.random() - 0.5)*0.5, vy: Math.random()*0.5 + 0.3, vz: (Math.random() - 0.5)*0.5, life: 1.0 };
            scene.add(p); particles.push(p);
        }
    }

    function updateProgressBar() { document.getElementById('progress-fill').style.width = `${(currentSequenceIndex / 3) * 100}%`; }

    function resetPlayerAndWorld() {
        player.position.set(0, 0, 0); playerBody.rotation.set(0,0,0);
        targetX = 0; loopCount = 1; speed = 0.8; 
        currentSequenceIndex = 0; currentLoopIdx = 0;
        
        gates.forEach(g => scene.remove(g)); gates = [];
        memoryBoards.forEach(b => scene.remove(b)); memoryBoards = [];
        particles.forEach(p => scene.remove(p)); particles = [];
        scenery.forEach(s => scene.remove(s)); scenery = [];

        spawnedLoops = 0; spawnLoop(0); spawnedLoops = 1;
        updateProgressBar();
    }

    function onPointerDown(e) { if (state === 'PLAYING') { isDragging = true; previousPointerX = e.touches ? e.touches[0].clientX : e.clientX; } }
    function onPointerMove(e) {
        if (!isDragging || state !== 'PLAYING') return;
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        targetX += (currentX - previousPointerX) * ((LANE_WIDTH * 2) / window.innerWidth * 1.5);
        targetX = Math.max(-BOUNDARY, Math.min(BOUNDARY, targetX));
        previousPointerX = currentX;
    }
    function onPointerUp(e) { isDragging = false; }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

    function handleGameOver(blameName) {
        if (state === 'GAMEOVER') return;
        state = 'GAMEOVER'; isDragging = false;
        document.getElementById('fail-blame').innerText = `${blameName} ${lang==='TR'?'HATA YAPTI!':'FAILED!'}`;
        document.getElementById('score-line').innerText = `${lang==='TR'?'Skor:':'Score:'} ${sessionCoins}`;
        document.getElementById('earned-coins').innerText = sessionCoins;
        coins += sessionCoins; updateCoinsUI();
        beep(150, 0.5); buzz(300);
        
        const guest = isMultiplayer && !isHost;
        document.getElementById('btn-again').style.display = guest ? 'none' : 'flex';
        document.getElementById('again-wait').style.display = guest ? 'block' : 'none';
        document.getElementById('btn-revive').style.display = 'flex';
        document.getElementById('ingame-hud').style.display = 'none';
        setScreen('screen-gameover');
    }

    window.resetGame = () => {
        if (peer) { peer.destroy(); peer = null; }
        conn = null; isMultiplayer = false; isHost = false; state = 'START';
        opponent.position.set(0, -100, 500); document.getElementById('ingame-hud').style.display = 'none';
        setScreen('screen-menu');
    }

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);
        const f = dt * 60; // normalized frame factor

        if(track && trackTexture) {
            track.position.z = player.position.z;
            trackTexture.offset.y -= speed * dt * 0.5; // Smooth infinite scroll illusion
        }

        if (isMultiplayer && conn && conn.open) {
            if (performance.now() - lastSync > 33) {
                lastSync = performance.now();
                conn.send({ type: 'sync', x: player.position.x, z: player.position.z, st: state, rd: round, sd: seed });
            }
        }

        if (state === 'PLAYING') {
            runTime += 0.15 * f;
            const prevZ = player.position.z;
            player.position.z -= speed * f;
            player.position.x += (targetX - player.position.x) * 0.2; 

            playerBody.position.y = Math.abs(Math.sin(runTime)) * 0.2;
            playerBody.rotation.z = (targetX - player.position.x) * -0.05; 
            leftLeg.rotation.x = Math.sin(runTime) * 0.8; rightLeg.rotation.x = -Math.sin(runTime) * 0.8;
            leftLeg.position.y = 0.45 + Math.abs(Math.sin(runTime)) * 0.3; rightLeg.position.y = 0.45 + Math.abs(Math.cos(runTime)) * 0.3;

            while (player.position.z < -(spawnedLoops - 1) * LOOP_LEN - 300) { spawnLoop(spawnedLoops); spawnedLoops++; }

            const idx = Math.max(0, Math.floor(-player.position.z / LOOP_LEN));
            if (idx !== currentLoopIdx) {
                currentLoopIdx = idx; loopCount = idx + 1;
                speed = Math.min(0.8 + (0.05 * idx), 1.6); // Cap speed
                currentSequenceIndex = 0; updateProgressBar();
            }

            for (let i = 0; i < gates.length; i++) {
                const row = gates[i];
                if (row.position.z > player.position.z - 1.0 && row.position.z < prevZ + 1.0) {
                    if (row.userData.passed) continue; 
                    let hitFace = null, closestDist = Infinity;
                    row.children.forEach(child => {
                        if (child.userData.isGate) {
                            const dist = Math.abs(player.position.x - child.userData.laneX);
                            if (dist < closestDist && dist < 1.5) { closestDist = dist; hitFace = child.userData.faceType; }
                        }
                    });

                    if (hitFace) {
                        if (hitFace === row.userData.required) {
                            row.userData.passed = true; row.position.y -= 100;
                            createParticles(row.position); sessionCoins += 5; beep(880, 0.1); buzz(40);
                            currentSequenceIndex = Math.max(currentSequenceIndex, row.userData.seqIndex + 1);
                            updateProgressBar();
                        } else {
                            handleGameOver(myName);
                            if(isMultiplayer && conn) conn.send({ type: 'gameover', blame: myName, rd: round });
                            break;
                        }
                    }
                }
            }

            memoryBoards.forEach(b => { if(player.position.z < b.position.z) b.position.y += 0.8 * f; });

            for (let i = gates.length - 1; i >= 0; i--) { if (gates[i].position.z > player.position.z + 30) { scene.remove(gates[i]); gates.splice(i, 1); } }
            for (let i = memoryBoards.length - 1; i >= 0; i--) { if (memoryBoards[i].position.z > player.position.z + 30) { scene.remove(memoryBoards[i]); memoryBoards.splice(i, 1); } }
            for (let i = scenery.length - 1; i >= 0; i--) { if (scenery[i].position.z > player.position.z + 80) { scene.remove(scenery[i]); scenery.splice(i, 1); } }

        } else if (state === 'GAMEOVER') {
            if (playerBody.rotation.x > -Math.PI / 2) { playerBody.rotation.x -= 0.1; playerBody.position.y = Math.max(0.2, playerBody.position.y - 0.05); }
        }

        if (isMultiplayer && opponent) {
            opponent.position.x += (oppTargetX - opponent.position.x) * 0.3;
            if (oppState === 'PLAYING') {
                opponent.position.z = player.position.z + (isHost ? 0.05 : -0.05);
                oppRunTime += 0.15; oppBody.rotation.x = 0; oppBody.position.y = Math.abs(Math.sin(oppRunTime)) * 0.2;
                oppLeftLeg.rotation.x = Math.sin(oppRunTime) * 0.8; oppRightLeg.rotation.x = -Math.sin(oppRunTime) * 0.8;
            } else if (oppState === 'GAMEOVER') {
                opponent.position.z = oppTargetZ; oppBody.rotation.x = -Math.PI / 2; oppBody.position.y = 0.2;
            }
        }

        for(let i=particles.length-1; i>=0; i--){
            let p = particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.vy -= 0.02; p.userData.life -= 0.03;
            p.scale.setScalar(Math.max(0, p.userData.life));
            if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
        }

        camera.position.z += ((player.position.z + 10) - camera.position.z) * 0.2;
        camera.position.x += ((player.position.x * 0.3) - camera.position.x) * 0.2;
        camera.lookAt(player.position.x * 0.2, 2, player.position.z - 10);

        scene.children.forEach(child => {
            if(child.type === 'DirectionalLight') {
                child.position.z = player.position.z + 10;
                child.target.position.set(0, 0, player.position.z);
                child.target.updateMatrixWorld();
            }
        });

        renderer.render(scene, camera);
    }
</script>
