<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Run 3D - Multiplayer Endless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Varela+Round&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #3b82f6; font-family: 'Varela Round', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(8px);
            transition: opacity 0.3s; opacity: 0; visibility: hidden;
        }
        .screen.active { opacity: 1; visibility: visible; }

        .game-title {
            font-family: 'Fredoka One', cursive; text-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 3.5rem; line-height: 1.1; text-align: center; color: white;
        }

        .btn {
            font-family: 'Fredoka One', cursive; border: none; color: white; padding: 14px 28px;
            font-size: 18px; border-radius: 30px; cursor: pointer;
            transition: transform 0.1s; text-transform: uppercase; pointer-events: auto;
            width: 100%; text-align: center;
        }
        .btn:active { transform: translateY(4px); }

        .input-field {
            padding: 12px 20px; border-radius: 20px; border: 3px solid #60a5fa;
            font-size: 18px; font-weight: bold; text-align: center; width: 100%;
            outline: none; color: #1e293b; margin-bottom: 12px;
        }

        .progress-bar-container {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; height: 16px;
            background: rgba(255,255,255,0.3); border-radius: 10px;
            border: 2px solid white; display: none; pointer-events: none;
        }
        .progress-fill { height: 100%; width: 0%; background: #4ade80; border-radius: 8px; transition: width 0.3s; }
    </style>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- 1. Name & Mode Selection -->
        <div class="screen active" id="screen-start">
            <h1 class="game-title mb-8">MOOD<br><span class="text-yellow-400">RUN</span></h1>
            
            <div class="bg-white/10 p-6 rounded-3xl border border-white/20 w-80 backdrop-blur-md">
                <p class="text-white font-bold mb-2 text-center">Your Name:</p>
                <input type="text" id="player-name" placeholder="Enter your name" class="input-field" maxlength="12">
                
                <div class="flex flex-col gap-3 mt-4">
                    <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="showHostMenu()">Create Room</button>
                    <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="showJoinMenu()">Join with Code</button>
                </div>
                <button class="text-white/60 underline font-bold mt-6 text-sm w-full text-center" onclick="startSolo()">Play Solo</button>
            </div>
        </div>

        <!-- 2. Host Room -->
        <div class="screen" id="screen-host">
            <h2 class="text-3xl font-black text-white mb-6">Create Room</h2>
            <div class="bg-white/20 p-6 rounded-3xl border border-white/30 text-center w-80 backdrop-blur-sm">
                <p class="text-white/80 text-sm font-bold mb-2">Give this 4-character code to your friend:</p>
                <h3 id="host-room-code" class="text-5xl font-black text-yellow-400 tracking-widest mb-4 drop-shadow-md">...</h3>
                <div id="host-capacity" class="bg-black/30 rounded-full py-2 px-4 inline-block text-white font-bold mb-4">
                    Players: 1/2
                </div>
                <button id="btn-start-mp" class="btn bg-green-500 shadow-[0_6px_0_#166534] mt-2 w-full hidden" onclick="startMultiplayer()">Start Game!</button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-3 w-full" onclick="backToStart()">Cancel</button>
            </div>
            <p id="host-status" class="text-white mt-4 font-bold text-center h-6">Generating code...</p>
        </div>

        <!-- 3. Join Room -->
        <div class="screen" id="screen-join">
            <h2 class="text-3xl font-black text-white mb-6">Join Room</h2>
            <div class="bg-white/10 p-6 rounded-3xl border border-white/20 w-80 backdrop-blur-sm">
                <p class="text-white/80 text-sm font-bold text-center mb-4">Enter the 4-character room code:</p>
                <input type="text" id="manual-join-code" placeholder="E.G. A1B2" class="input-field !mb-6 uppercase text-3xl tracking-widest text-center" maxlength="4">
                <button class="btn bg-green-500 shadow-[0_6px_0_#14532d] w-full" onclick="joinByCode()">Join</button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-3 w-full" onclick="backToStart()">Back</button>
            </div>
            <p id="join-status" class="text-yellow-300 mt-4 font-bold text-center h-6"></p>
        </div>

        <!-- 4. Game Over -->
        <div class="screen" id="screen-gameover">
            <h1 class="game-title text-red-500 mb-4" style="text-shadow: 0 4px 0px #991b1b;">OOPS!</h1>
            <div class="bg-white px-8 py-6 rounded-3xl text-center mb-8 shadow-2xl">
                <div class="text-7xl mb-2">💀</div>
                <p id="fail-blame" class="text-red-600 font-black text-xl uppercase tracking-wider">Wrong Gate</p>
            </div>
            <div class="flex flex-col gap-4 w-72">
                <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="resetGame()">Play Again</button>
            </div>
        </div>
    </div>

<script type="module">
    const FACES = ['smile', 'neutral', 'sad'];
    const LANE_WIDTH = 3.2; 
    const BOUNDARY = LANE_WIDTH * 1.1; 
    const LOOP_LEN = 440; // distance between the start of each round
    
    let scene, camera, renderer, track, trackLines;
    let player, playerBody, leftLeg, rightLeg;
    let opponent, oppBody, oppLeftLeg, oppRightLeg;
    let playerLabel, oppLabel;
    
    let gates = [], memoryBoards = [], particles = [];
    let state = 'START'; 
    let speed = 0.6; 
    let loopCount = 1;
    let runTime = 0, oppRunTime = 0;
    let targetX = 0, isDragging = false, previousPointerX = 0;

    // Level is generated from a shared seed, so both players always see the same gates
    let seed = 1, spawnedLoops = 0, currentLoopIdx = 0;
    let currentSequenceIndex = 0;

    // Multiplayer P2P State
    let peer = null, conn = null;
    let isMultiplayer = false, isHost = false;
    let oppTargetX = 0, oppTargetZ = 500, oppState = 'START';
    let myName = "Player 1", oppName = "Player 2";
    let lastSync = 0;

    // --- UI ---
    window.setScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if (id) document.getElementById(id).classList.add('active');
        document.getElementById('progress-container').style.display = (id === null) ? 'block' : 'none';
    }

    window.backToStart = () => {
        if (peer) { peer.destroy(); peer = null; }
        conn = null; isMultiplayer = false; isHost = false;
        setScreen('screen-start');
    }

    // --- P2P MULTIPLAYER (serverless) ---
    window.showHostMenu = () => {
        myName = document.getElementById('player-name').value.trim() || "Host";
        updateNameLabel(playerLabel, myName);
        setScreen('screen-host');
        createRoom();
    }

    window.showJoinMenu = () => {
        myName = document.getElementById('player-name').value.trim() || "Guest";
        updateNameLabel(playerLabel, myName);
        setScreen('screen-join');
    }

    window.createRoom = () => {
        const shortCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        document.getElementById('host-room-code').innerText = shortCode;
        document.getElementById('host-capacity').innerText = "Players: 1/2";
        document.getElementById('btn-start-mp').classList.add('hidden');
        document.getElementById('host-status').innerText = "Opening room...";
        
        isMultiplayer = true; isHost = true;
        
        if (peer) peer.destroy();
        peer = new Peer(`moodrun-p2p-${shortCode}`);
        
        peer.on('open', () => {
            document.getElementById('host-status').innerText = "Room is open! Waiting for your friend to enter the code...";
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') createRoom();
            else document.getElementById('host-status').innerText = "Connection error: " + err.type;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            document.getElementById('host-capacity').innerText = "Players: 2/2";
            document.getElementById('host-status').innerText = "Opponent connected! You can start the game.";
            document.getElementById('btn-start-mp').classList.remove('hidden');
            setupConnectionListeners(conn);
            conn.on('open', () => { conn.send({ type: 'join', name: myName }); });
        });
    }

    window.joinByCode = () => {
        const code = document.getElementById('manual-join-code').value.trim().toUpperCase();
        if (!code || code.length !== 4) return alert("Please enter the 4-character room code.");
        
        isMultiplayer = true; isHost = false;
        document.getElementById('join-status').innerText = "Connecting to room...";
        
        if (peer) peer.destroy();
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(`moodrun-p2p-${code}`, { reliable: true });
            setupConnectionListeners(conn); // listen right away so no message is missed
            conn.on('open', () => {
                document.getElementById('join-status').innerText = "Joined! Waiting for the host to start...";
                conn.send({ type: 'join', name: myName });
            });
        });
        peer.on('error', () => {
            document.getElementById('join-status').innerText = "Connection error or room not found!";
        });
    }

    function setupConnectionListeners(c) {
        c.on('data', (data) => {
            if (data.type === 'join') {
                oppName = data.name;
                updateNameLabel(oppLabel, oppName);
            } else if (data.type === 'start') {
                seed = data.seed;
                beginRace();
            } else if (data.type === 'sync') {
                oppTargetX = data.x;
                oppTargetZ = data.z;
                oppState = data.st;
            } else if (data.type === 'gameover') {
                handleGameOver(data.blame);
            }
        });
    }

    function beginRace() {
        resetPlayerAndWorld();
        setScreen(null);
        state = 'PLAYING';
        opponent.position.set(0, 0, 0);
        oppTargetX = 0; oppTargetZ = 0;
        oppState = 'PLAYING';
    }

    window.startMultiplayer = () => {
        if (!isHost || !conn || !conn.open) return;
        seed = Math.floor(Math.random() * 1e9);
        conn.send({ type: 'start', seed: seed });
        beginRace();
    }

    window.startSolo = () => {
        isMultiplayer = false;
        myName = document.getElementById('player-name').value.trim() || "You";
        updateNameLabel(playerLabel, myName);
        seed = Math.floor(Math.random() * 1e9);
        resetPlayerAndWorld();
        setScreen(null);
        state = 'PLAYING';
        opponent.position.set(0, -100, 500); 
    }

    // --- 3D ENGINE ---
    init();
    animate();

    function init() {
        const container = document.getElementById('game-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3b82f6); 
        scene.fog = new THREE.Fog(0x3b82f6, 40, 200); 

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
        camera.position.set(0, 7, 14); 
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(-15, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        createTrack();
        setupPlayers();

        window.addEventListener('resize', onWindowResize);
        
        const inputArea = document.body;
        inputArea.addEventListener('mousedown', onPointerDown);
        inputArea.addEventListener('mousemove', onPointerMove);
        inputArea.addEventListener('mouseup', onPointerUp);
        inputArea.addEventListener('mouseleave', onPointerUp);
        inputArea.addEventListener('touchstart', onPointerDown, {passive: false});
        inputArea.addEventListener('touchmove', onPointerMove, {passive: false});
        inputArea.addEventListener('touchend', onPointerUp);
    }

    function createTrack() {
        const geometry = new THREE.BoxGeometry(LANE_WIDTH * 3 + 2, 1, 3000);
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
        track = new THREE.Mesh(geometry, material);
        track.position.set(0, -0.5, 0);
        track.receiveShadow = true;
        scene.add(track);

        const lineGeo = new THREE.PlaneGeometry(0.2, 3000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
        trackLines = new THREE.Group();
        const line1 = new THREE.Mesh(lineGeo, lineMat);
        line1.position.set(-LANE_WIDTH/2, 0.02, 0); line1.rotation.x = -Math.PI / 2;
        const line2 = new THREE.Mesh(lineGeo, lineMat);
        line2.position.set(LANE_WIDTH/2, 0.02, 0); line2.rotation.x = -Math.PI / 2;
        trackLines.add(line1); trackLines.add(line2);
        scene.add(trackLines);
    }

    function createCharacterConfig(colorHex) {
        const charGroup = new THREE.Group();
        const charBody = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.1 }); 

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.0, 16), mat);
        torso.position.y = 1.4; torso.castShadow = true; charBody.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), mat);
        head.position.y = 2.2; head.castShadow = true; charBody.add(head);

        const legGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
        const lLeg = new THREE.Mesh(legGeo, mat);
        lLeg.position.set(-0.18, 0.45, 0); lLeg.castShadow = true; charBody.add(lLeg);
        const rLeg = new THREE.Mesh(legGeo, mat);
        rLeg.position.set(0.18, 0.45, 0); rLeg.castShadow = true; charBody.add(rLeg);

        charGroup.add(charBody);
        return { root: charGroup, body: charBody, leftLeg: lLeg, rightLeg: rLeg };
    }

    function createTextSprite(text, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const context = canvas.getContext('2d');
        context.font = "Bold 40px 'Varela Round', sans-serif";
        context.fillStyle = color;
        context.textAlign = "center";
        context.fillText(text, 128, 48);
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(4, 1, 1);
        sprite.position.y = 3.5;
        return sprite;
    }

    function updateNameLabel(sprite, name) {
        const context = sprite.material.map.image.getContext('2d');
        context.clearRect(0, 0, 256, 64);
        context.fillStyle = sprite.material.map.image.dataset.color || '#ffffff';
        context.fillText(name, 128, 48);
        sprite.material.map.needsUpdate = true;
    }

    function setupPlayers() {
        const myChar = createCharacterConfig(0xef4444); 
        player = myChar.root; playerBody = myChar.body; leftLeg = myChar.leftLeg; rightLeg = myChar.rightLeg;
        playerLabel = createTextSprite("You", "#ffffff");
        playerLabel.material.map.image.dataset.color = "#ffffff";
        player.add(playerLabel);
        scene.add(player);

        const oppChar = createCharacterConfig(0x0ea5e9); 
        opponent = oppChar.root; oppBody = oppChar.body; oppLeftLeg = oppChar.leftLeg; oppRightLeg = oppChar.rightLeg;
        oppLabel = createTextSprite("Rival", "#facc15"); 
        oppLabel.material.map.image.dataset.color = "#facc15";
        opponent.add(oppLabel);
        opponent.position.set(0, -100, 500); 
        scene.add(opponent);
    }

    function drawCustomFace(ctx, type, isMemoryBoard) {
        ctx.fillStyle = isMemoryBoard ? 'transparent' : 'rgba(255, 255, 255, 0.9)';
        if(!isMemoryBoard) {
            ctx.beginPath(); ctx.roundRect(20, 20, 472, 472, 80); ctx.fill();
            ctx.lineWidth = 10; ctx.strokeStyle = '#e2e8f0'; ctx.stroke();
        }

        ctx.lineWidth = 35; ctx.lineCap = 'round';
        ctx.strokeStyle = isMemoryBoard ? '#ffffff' : '#1e293b';
        ctx.fillStyle = isMemoryBoard ? '#ffffff' : '#1e293b';
        
        ctx.beginPath(); ctx.arc(170, 200, 25, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(342, 200, 25, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath();
        if (type === 'smile') {
            ctx.arc(256, 260, 110, 0.1 * Math.PI, 0.9 * Math.PI);
        } else if (type === 'sad') {
            ctx.arc(256, 390, 110, 1.1 * Math.PI, 1.9 * Math.PI);
        } else if (type === 'neutral') { 
            ctx.moveTo(160, 310); ctx.lineTo(352, 310); 
        }
        ctx.stroke();
    }

    function createFaceTexture(type, isMemoryBoard = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        drawCustomFace(ctx, type, isMemoryBoard);
        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
    }

    // Deterministic RNG: same seed + same round number = same level on every device
    function mulberry32(a) {
        return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function getLoopData(k) {
        const rng = mulberry32((seed + k * 7919) >>> 0);
        const sequence = [], rows = [];
        for (let i = 0; i < 3; i++) {
            sequence.push(FACES[Math.floor(rng() * FACES.length)]);
            const row = [...FACES];
            for (let j = row.length - 1; j > 0; j--) {
                const r = Math.floor(rng() * (j + 1));
                [row[j], row[r]] = [row[r], row[j]];
            }
            rows.push(row);
        }
        return { sequence, gates: rows };
    }

    function spawnLoop(k) {
        const data = getLoopData(k);
        const base = -k * LOOP_LEN;
        spawnMemoryBoard(base - 100, data);
        spawnGateRow(base - 220, 0, data);
        spawnGateRow(base - 320, 1, data);
        spawnGateRow(base - 420, 2, data);
    }

    function spawnMemoryBoard(zPos, data) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(30, 58, 138, 0.95)'; 
        ctx.beginPath(); ctx.roundRect(10, 10, 1004, 492, 40); ctx.fill();
        ctx.lineWidth = 15; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 70px "Fredoka One", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`REMEMBER THE ORDER!`, 512, 120);

        const startX = 180; const spacing = 330;
        data.sequence.forEach((face, index) => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 512; tempCanvas.height = 512;
            const tCtx = tempCanvas.getContext('2d');
            drawCustomFace(tCtx, face, true);
            
            ctx.drawImage(tempCanvas, startX + (index * spacing) - 100, 180, 200, 200);
            if(index < 2) {
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 80px sans-serif';
                ctx.fillText('→', startX + (index * spacing) + 165, 300);
            }
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const geo = new THREE.PlaneGeometry(14, 7);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const board = new THREE.Mesh(geo, mat);
        
        board.position.set(0, 6, zPos);
        scene.add(board);
        memoryBoards.push(board);
    }

    function spawnGateRow(zPos, seqIndex, data) {
        const row = new THREE.Group();
        row.position.z = zPos;
        row.userData = { passed: false, seqIndex: seqIndex, required: data.sequence[seqIndex] };
        
        const rowFaces = data.gates[seqIndex];
        const gateWidth = LANE_WIDTH * 0.95;
        const gateHeight = 4.5;

        for(let i=0; i<3; i++) {
            const laneOffset = (i - 1) * LANE_WIDTH; 
            const faceType = rowFaces[i];

            const geo = new THREE.BoxGeometry(gateWidth, gateHeight, 0.4);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 0.1, roughness: 0.1,
                transmission: 0.9, transparent: true, opacity: 0.8,
                clearcoat: 1.0, clearcoatRoughness: 0.1
            });
            const gateMesh = new THREE.Mesh(geo, mat);
            gateMesh.position.set(laneOffset, gateHeight/2, 0);
            gateMesh.receiveShadow = true;

            const texGeo = new THREE.PlaneGeometry(gateWidth * 0.6, gateWidth * 0.6);
            const texMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(faceType, false), transparent: true });
            const texMesh = new THREE.Mesh(texGeo, texMat);
            texMesh.position.set(laneOffset, gateHeight/2 + 0.5, 0.21); 

            row.add(gateMesh); row.add(texMesh);
            gateMesh.userData = { faceType: faceType, isGate: true, laneX: laneOffset };
        }
        scene.add(row);
        gates.push(row);
    }

    function createParticles(position) {
        const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const mat = new THREE.MeshStandardMaterial({color: 0x4ade80});
        for(let i=0; i<15; i++) {
            const p = new THREE.Mesh(geo, mat);
            p.position.copy(position); p.position.y += 2;
            p.position.x += (Math.random() - 0.5) * 3;
            p.userData = {
                vx: (Math.random() - 0.5) * 0.4, vy: Math.random() * 0.4 + 0.2, vz: (Math.random() - 0.5) * 0.4,
                life: 1.0
            };
            scene.add(p); particles.push(p);
        }
    }

    function updateProgressBar() {
        document.getElementById('progress-fill').style.width = `${(currentSequenceIndex / 3) * 100}%`;
    }

    function resetPlayerAndWorld() {
        player.position.set(0, 0, 0); playerBody.rotation.set(0,0,0);
        targetX = 0; loopCount = 1; speed = 0.6;
        currentSequenceIndex = 0; currentLoopIdx = 0;
        
        gates.forEach(g => scene.remove(g)); gates = [];
        memoryBoards.forEach(b => scene.remove(b)); memoryBoards = [];
        particles.forEach(p => scene.remove(p)); particles = [];

        spawnedLoops = 0;
        spawnLoop(0); spawnedLoops = 1;
        updateProgressBar();
    }

    function onPointerDown(e) { if (state === 'PLAYING') { isDragging = true; previousPointerX = e.touches ? e.touches[0].clientX : e.clientX; } }
    function onPointerMove(e) {
        if (!isDragging || state !== 'PLAYING') return;
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        const deltaX = currentX - previousPointerX;
        targetX += deltaX * ((LANE_WIDTH * 2) / window.innerWidth * 1.5);
        targetX = Math.max(-BOUNDARY, Math.min(BOUNDARY, targetX));
        previousPointerX = currentX;
    }
    function onPointerUp(e) { isDragging = false; }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function handleGameOver(blameName) {
        state = 'GAMEOVER';
        document.getElementById('fail-blame').innerText = `${blameName} MADE A MISTAKE!`;
        setScreen('screen-gameover');
    }

    window.resetGame = () => { window.location.reload(); }

    function animate() {
        requestAnimationFrame(animate);

        // Endless track follows the player
        if(track && trackLines) {
            track.position.z = player.position.z;
            trackLines.position.z = player.position.z;
        }

        // P2P sync (throttled to ~30 per second)
        const now = performance.now();
        if (isMultiplayer && conn && conn.open && now - lastSync > 33) {
            lastSync = now;
            conn.send({ type: 'sync', x: player.position.x, z: player.position.z, st: state });
        }

        if (state === 'PLAYING') {
            runTime += 0.15;
            player.position.z -= speed;
            player.position.x += (targetX - player.position.x) * 0.2; 

            playerBody.position.y = Math.abs(Math.sin(runTime)) * 0.2;
            playerBody.rotation.z = (targetX - player.position.x) * -0.05; 
            leftLeg.rotation.x = Math.sin(runTime) * 0.8; rightLeg.rotation.x = -Math.sin(runTime) * 0.8;
            leftLeg.position.y = 0.45 + Math.abs(Math.sin(runTime)) * 0.3; rightLeg.position.y = 0.45 + Math.abs(Math.cos(runTime)) * 0.3;

            // Spawn upcoming rounds locally from the shared seed (no network messages needed)
            while (player.position.z < -(spawnedLoops - 1) * LOOP_LEN - 300) {
                spawnLoop(spawnedLoops); spawnedLoops++;
            }

            // New round: speed up and reset progress bar
            const idx = Math.max(0, Math.floor(-player.position.z / LOOP_LEN));
            if (idx !== currentLoopIdx) {
                currentLoopIdx = idx; loopCount = idx + 1;
                speed = 0.6 + 0.02 * idx;
                currentSequenceIndex = 0; updateProgressBar();
            }

            // Collision test (each player tracks their own gates)
            for (let i = 0; i < gates.length; i++) {
                const row = gates[i];
                if (row.position.z > player.position.z - 1.0 && row.position.z < player.position.z + 1.0) {
                    if (row.userData.passed) continue; 
                    let hitFace = null, closestDist = Infinity;
                    
                    row.children.forEach(child => {
                        if (child.userData.isGate) {
                            const dist = Math.abs(player.position.x - child.userData.laneX);
                            if (dist < closestDist && dist < 1.5) { closestDist = dist; hitFace = child.userData.faceType; }
                        }
                    });

                    if (hitFace) {
                        if (hitFace === row.userData.required) {
                            row.userData.passed = true; row.position.y -= 100;
                            createParticles(row.position);
                            currentSequenceIndex = Math.max(currentSequenceIndex, row.userData.seqIndex + 1);
                            updateProgressBar();
                        } else {
                            handleGameOver(myName);
                            if(isMultiplayer && conn) conn.send({ type: 'gameover', blame: myName });
                            break;
                        }
                    }
                }
            }

            memoryBoards.forEach(b => { if(player.position.z < b.position.z) b.position.y += 0.5; });

            // Remove objects left behind
            for (let i = gates.length - 1; i >= 0; i--) {
                if (gates[i].position.z > player.position.z + 30) { scene.remove(gates[i]); gates.splice(i, 1); }
            }
            for (let i = memoryBoards.length - 1; i >= 0; i--) {
                if (memoryBoards[i].position.z > player.position.z + 30) { scene.remove(memoryBoards[i]); memoryBoards.splice(i, 1); }
            }

        } else if (state === 'GAMEOVER') {
            if (playerBody.rotation.x > -Math.PI / 2) {
                playerBody.rotation.x -= 0.1;
                playerBody.position.y = Math.max(0.2, playerBody.position.y - 0.05);
            }
        }

        // --- OPPONENT ---
        if (isMultiplayer && opponent) {
            opponent.position.x += (oppTargetX - opponent.position.x) * 0.3;

            if (oppState === 'PLAYING') {
                // Keep the opponent side by side with you, ignoring network lag
                opponent.position.z = player.position.z + (isHost ? 0.05 : -0.05);

                oppRunTime += 0.15; oppBody.rotation.x = 0;
                oppBody.position.y = Math.abs(Math.sin(oppRunTime)) * 0.2;
                oppLeftLeg.rotation.x = Math.sin(oppRunTime) * 0.8; oppRightLeg.rotation.x = -Math.sin(oppRunTime) * 0.8;
            } else if (oppState === 'GAMEOVER') {
                opponent.position.z = oppTargetZ;
                oppBody.rotation.x = -Math.PI / 2; oppBody.position.y = 0.2;
            }
        }

        // Particles
        for(let i=particles.length-1; i>=0; i--){
            let p = particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.vy -= 0.01; p.userData.life -= 0.02;
            p.scale.setScalar(Math.max(0, p.userData.life));
            if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
        }

        // Camera
        camera.position.z += ((player.position.z + 10) - camera.position.z) * 0.15;
        camera.position.x += ((player.position.x * 0.3) - camera.position.x) * 0.15;
        camera.lookAt(player.position.x * 0.2, 2, player.position.z - 10);

        scene.children.forEach(child => {
            if(child.type === 'DirectionalLight') {
                child.position.z = player.position.z + 10;
                child.target.position.set(0, 0, player.position.z);
                child.target.updateMatrixWorld();
            }
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
