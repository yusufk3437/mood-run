<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Run 3D - Multiplayer Endless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Varela+Round&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #3b82f6; font-family: 'Varela Round', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(8px);
            transition: opacity 0.3s; opacity: 0; visibility: hidden;
        }
        .screen.active { opacity: 1; visibility: visible; }

        .game-title {
            font-family: 'Fredoka One', cursive; text-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 3.5rem; line-height: 1.1; text-align: center; color: white;
        }

        .btn {
            font-family: 'Fredoka One', cursive; border: none; color: white; padding: 14px 28px;
            font-size: 18px; border-radius: 30px; cursor: pointer;
            transition: transform 0.1s; text-transform: uppercase; pointer-events: auto;
            width: 100%; text-align: center;
        }
        .btn:active { transform: translateY(4px); }

        .input-field {
            padding: 12px 20px; border-radius: 20px; border: 3px solid #60a5fa;
            font-size: 18px; font-weight: bold; text-align: center; width: 100%;
            outline: none; color: #1e293b; margin-bottom: 12px;
        }

        .room-list-item {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px; cursor: pointer; transition: background 0.2s;
        }
        .room-list-item:hover { background: rgba(255,255,255,0.2); }

        .progress-bar-container {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; height: 16px;
            background: rgba(255,255,255,0.3); border-radius: 10px;
            border: 2px solid white; display: none; pointer-events: none;
        }
        .progress-fill { height: 100%; width: 0%; background: #4ade80; border-radius: 8px; transition: width 0.3s; }

        #custom-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 24px; border-radius: 24px; z-index: 50;
            display: none; flex-direction: column; width: 80%; max-width: 350px;
            pointer-events: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 3D Game Container -->
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- 1. Name & Mode Selection Screen -->
        <div class="screen active" id="screen-start">
            <h1 class="game-title mb-8">MOOD<br><span class="text-yellow-400">RUN</span></h1>
            
            <div class="bg-white/10 p-6 rounded-3xl border border-white/20 w-80 backdrop-blur-md">
                <p class="text-white font-bold mb-2 text-center">Oyuncu Adın:</p>
                <input type="text" id="player-name" placeholder="İsmini Gir" class="input-field" maxlength="12">
                
                <div class="flex flex-col gap-3 mt-4">
                    <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="showHostMenu()">Oda Kur</button>
                    <button class="btn bg-green-500 shadow-[0_6px_0_#14532d]" onclick="showJoinMenu()">Odalara Katıl</button>
                </div>
                <button class="text-white/60 underline font-bold mt-6 text-sm w-full text-center" onclick="startSolo()">Tek Kişilik Oyna</button>
            </div>
            <p id="auth-status" class="text-white/50 text-xs mt-4">Sunucuya bağlanılıyor...</p>
        </div>

        <!-- 2. Host Room Screen -->
        <div class="screen" id="screen-host">
            <h2 class="text-3xl font-black text-white mb-6">Oda Kur</h2>
            <div class="bg-white/10 p-6 rounded-3xl border border-white/20 w-80">
                <input type="text" id="host-room-name" placeholder="Oda Adı" class="input-field">
                <input type="text" id="host-room-pass" placeholder="Şifre (Zorunlu)" class="input-field">
                
                <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a] mt-4" onclick="createRoom()">Odayı Aç</button>
                <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-3" onclick="setScreen('screen-start')">İptal</button>
            </div>
            <div id="fallback-code-container" class="hidden mt-4 bg-white/20 p-4 rounded-xl border border-white/30 text-center w-80 backdrop-blur-sm">
                <p class="text-white/80 text-sm font-bold">Arkadaşına bu kodu ver:</p>
                <h3 id="fallback-room-code" class="text-4xl font-black text-yellow-400 tracking-widest mt-2 drop-shadow-md"></h3>
            </div>
            <p id="host-status" class="text-yellow-300 mt-4 font-bold text-center h-6"></p>
            <button id="btn-start-mp" class="btn bg-yellow-400 text-black shadow-[0_6px_0_#a16207] mt-4 w-80 hidden" onclick="startMultiplayer()">Oyunu Başlat!</button>
        </div>

        <!-- 3. Join Room Screen -->
        <div class="screen" id="screen-join">
            <h2 class="text-3xl font-black text-white mb-6">Odalar</h2>
            <div class="bg-white/10 p-4 rounded-3xl border border-white/20 w-80 h-64 overflow-y-auto" id="room-list">
                <p class="text-white/50 text-center mt-10">Oda aranıyor...</p>
            </div>
            <div class="bg-white/10 p-4 rounded-3xl border border-white/20 w-80 mt-4 backdrop-blur-sm">
                <p class="text-white/80 text-sm font-bold text-center mb-2">Veya Kod ile Katıl:</p>
                <div class="flex gap-2">
                    <input type="text" id="manual-join-code" placeholder="ÖRN: A1B2" class="input-field !mb-0 uppercase" maxlength="4">
                    <button class="btn bg-green-500 shadow-[0_4px_0_#14532d] !px-4" onclick="joinByCode()">Katıl</button>
                </div>
            </div>
            <button class="btn bg-gray-500 shadow-[0_4px_0_#374151] mt-4 w-80" onclick="setScreen('screen-start')">Geri Dön</button>
            <p id="join-status" class="text-yellow-300 mt-4 font-bold text-center h-6"></p>
        </div>

        <!-- Game Over Screen -->
        <div class="screen" id="screen-gameover">
            <h1 class="game-title text-red-500 mb-4" style="text-shadow: 0 4px 0px #991b1b;">EYVAH!</h1>
            <div class="bg-white px-8 py-6 rounded-3xl text-center mb-8 shadow-2xl">
                <div class="text-7xl mb-2">💀</div>
                <p id="fail-blame" class="text-red-600 font-black text-xl uppercase tracking-wider">Yanlış Kapı</p>
            </div>
            <div class="flex flex-col gap-4 w-72">
                <button class="btn bg-blue-500 shadow-[0_6px_0_#1e3a8a]" onclick="resetGame()">Baştan Başla</button>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div id="custom-modal">
        <h3 class="text-xl font-bold text-center mb-4 text-gray-800" id="modal-title">Şifre Girin</h3>
        <input type="password" id="modal-input" class="input-field !border-gray-300 !mb-4">
        <div class="flex gap-2">
            <button class="btn bg-gray-400 !padding-2 w-1/2" onclick="closeModal()">İptal</button>
            <button class="btn bg-green-500 shadow-[0_4px_0_#166534] w-1/2" onclick="submitModal()">Katıl</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'mood-run-mp';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    
    let db, auth, currentUser;
    let availableRooms = [];
    let myRoomDocId = null;

    if (firebaseConfig) {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        
        // Auto Authenticate
        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        if (token) {
            signInWithCustomToken(auth, token).then(res => { currentUser = res.user; listenToRooms(); })
            .catch(err => console.error(err));
        } else {
            signInAnonymously(auth).then(res => { currentUser = res.user; listenToRooms(); })
            .catch(err => console.error(err));
        }
    }

    function listenToRooms() {
        if (!currentUser) return;
        document.getElementById('auth-status').innerText = "Bağlantı Hazır ✅";
        const roomsRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
        onSnapshot(roomsRef, (snapshot) => {
            availableRooms = [];
            snapshot.forEach(doc => availableRooms.push({ id: doc.id, ...doc.data() }));
            renderRoomList();
        }, (err) => console.error(err));
    }

    // Modal Logic
    let modalCallback = null;
    window.closeModal = () => { document.getElementById('custom-modal').style.display = 'none'; }
    window.submitModal = () => {
        const val = document.getElementById('modal-input').value;
        closeModal();
        if(modalCallback) modalCallback(val);
    }
    function showPrompt(title, callback) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-input').value = '';
        document.getElementById('custom-modal').style.display = 'flex';
        modalCallback = callback;
    }

    const FACES = ['smile', 'neutral', 'sad'];
    const LANE_WIDTH = 3.2; 
    const BOUNDARY = LANE_WIDTH * 1.1; 
    
    let scene, camera, renderer, trackLines;
    let player, playerBody, leftLeg, rightLeg;
    let opponent, oppBody, oppLeftLeg, oppRightLeg;
    let playerLabel, oppLabel;
    
    let gates = [], memoryBoards = [];
    let state = 'START'; 
    let speed = 0.6; 
    let loopCount = 1;
    let runTime = 0, oppRunTime = 0;
    let targetX = 0, isDragging = false, previousPointerX = 0;

    let levelData = { sequence: [], gates: [] };
    let currentSequenceIndex = 0;

    let peer = null, conn = null;
    let isMultiplayer = false, isHost = false;
    let oppTargetX = 0, oppTargetZ = 500, oppState = 'START';
    let myName = "Oyuncu 1", oppName = "Oyuncu 2";

    window.setScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if (id) document.getElementById(id).classList.add('active');
        document.getElementById('progress-container').style.display = (id === null) ? 'block' : 'none';
    }

    window.showHostMenu = () => {
        myName = document.getElementById('player-name').value.trim() || "Host";
        updateNameLabel(playerLabel, myName);
        setScreen('screen-host');
    }

    window.showJoinMenu = () => {
        myName = document.getElementById('player-name').value.trim() || "Guest";
        updateNameLabel(playerLabel, myName);
        setScreen('screen-join');
    }

    window.createRoom = async () => {
        const rName = document.getElementById('host-room-name').value.trim();
        const rPass = document.getElementById('host-room-pass').value.trim();
        if (!rName || !rPass) return alert("Oda adı ve şifre zorunlu!");

        document.getElementById('host-status').innerText = "Oda açılıyor...";
        isMultiplayer = true; isHost = true;
        
        // Dış sunucular için 4 haneli kısa ID oluştur (DB bağımsız)
        const shortCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        const fullPeerId = `moodrun-room-${shortCode}`;
        
        peer = new Peer(fullPeerId);
        
        peer.on('open', async (id) => {
            document.getElementById('fallback-code-container').classList.remove('hidden');
            document.getElementById('fallback-room-code').innerText = shortCode;
            document.getElementById('host-status').innerText = "Oda Açıldı! Rakip bekleniyor...";

            // Eğer Firebase ortamı aktifse listeye de eklemeyi dene
            if (currentUser && db) {
                try {
                    const roomData = { name: rName, pass: rPass, peerId: id, hostName: myName, time: Date.now() };
                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'), roomData);
                    myRoomDocId = docRef.id;
                    window.addEventListener('beforeunload', () => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomDocId)));
                } catch (err) { console.warn("Firebase listeleme yapılamadı, ancak oda kod ile oynanabilir."); }
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            document.getElementById('host-status').innerText = "Rakip bağlandı! Başlatabilirsin.";
            document.getElementById('btn-start-mp').classList.remove('hidden');
            setupConnectionListeners();
        });
    }

    window.joinByCode = () => {
        const code = document.getElementById('manual-join-code').value.trim().toUpperCase();
        if(!code || code.length < 4) return alert("Lütfen 4 haneli oda kodunu girin.");
        
        isMultiplayer = true; isHost = false;
        document.getElementById('join-status').innerText = "Koda bağlanılıyor...";
        const fullPeerId = `moodrun-room-${code}`;
        
        if(!peer) peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(fullPeerId);
            setupJoinConnection(conn);
        });
    }

    function renderRoomList() {
        const container = document.getElementById('room-list');
        container.innerHTML = '';
        if(availableRooms.length === 0) {
            container.innerHTML = '<p class="text-white/50 text-center mt-10">Açık oda yok.</p>';
            return;
        }
        availableRooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-list-item';
            div.innerHTML = `<span class="text-white font-bold">${room.name}</span><span class="text-white/70 text-sm">Kurucu: ${room.hostName}</span>`;
            div.onclick = () => handleJoinRoomClick(room);
            container.appendChild(div);
        });
    }

    function handleJoinRoomClick(room) {
        showPrompt(`${room.name} Şifresi:`, (enteredPass) => {
            if (enteredPass !== room.pass) {
                document.getElementById('join-status').innerText = "Hatalı şifre!";
                return;
            }
            document.getElementById('join-status').innerText = "Bağlanılıyor...";
            isMultiplayer = true; isHost = false;
            
            if(!peer) peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(room.peerId);
                setupJoinConnection(conn);
            });
        });
    }

    function setupJoinConnection(connection) {
        connection.on('open', () => {
            document.getElementById('join-status').innerText = "Odaya girildi! Kurucunun başlatması bekleniyor...";
            connection.send({ type: 'join', name: myName });
            setupConnectionListeners();
        });
        connection.on('error', (err) => {
            document.getElementById('join-status').innerText = "Bağlantı hatası!";
        });
    }

    function setupConnectionListeners() {
        conn.on('data', (data) => {
            if (data.type === 'join') {
                oppName = data.name;
                updateNameLabel(oppLabel, oppName);
            } else if (data.type === 'start' || data.type === 'new_loop') {
                levelData = data.level;
                currentSequenceIndex = 0;
                
                if(data.type === 'start') {
                    // Start of the game
                    if(isHost && myRoomDocId) {
                        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', myRoomDocId)); // Hide room
                    }
                    resetPlayerAndWorld();
                    setScreen(null);
                    state = 'PLAYING';
                    opponent.position.set(0, 0, 0);
                    oppTargetZ = 0;
                } else {
                    // Endless loop continuation received by guest
                    loopCount++;
                    speed += 0.02;
                    spawnMemoryBoard(data.zPos - 80);
                    spawnGateRow(data.zPos - 150, 0);
                    spawnGateRow(data.zPos - 220, 1);
                    spawnGateRow(data.zPos - 290, 2);
                }
                updateProgressBar();
            } else if (data.type === 'sync') {
                oppTargetX = data.x;
                oppTargetZ = data.z;
                oppState = data.st;
            } else if (data.type === 'gameover') {
                handleGameOver(data.blame);
            } else if (data.type === 'gate_passed') {
                // Drop the gate locally since partner passed it
                const gateToDrop = gates.find(g => g.userData.seqIndex === data.index && !g.userData.passed);
                if(gateToDrop) {
                    gateToDrop.userData.passed = true;
                    gateToDrop.position.y -= 100;
                    currentSequenceIndex = Math.max(currentSequenceIndex, data.index + 1);
                    updateProgressBar();
                }
            }
        });
    }

    window.startMultiplayer = () => {
        if(!isHost || !conn || !conn.open) return;
        generateLevelData();
        conn.send({ type: 'start', level: levelData });
        resetPlayerAndWorld();
        setScreen(null);
        state = 'PLAYING';
    }

    window.startSolo = () => {
        isMultiplayer = false;
        myName = document.getElementById('player-name').value.trim() || "Sen";
        updateNameLabel(playerLabel, myName);
        generateLevelData();
        resetPlayerAndWorld();
        setScreen(null);
        state = 'PLAYING';
        opponent.position.set(0, -100, 500); 
    }

    init();
    animate();

    function init() {
        const container = document.getElementById('game-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3b82f6); 
        scene.fog = new THREE.Fog(0x3b82f6, 40, 180); 

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 250);
        camera.position.set(0, 7, 12); 
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(-15, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.top = 20; dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -15; dirLight.shadow.camera.right = 15;
        scene.add(dirLight);

        createTrack();
        setupPlayers();

        window.addEventListener('resize', onWindowResize);
        
        const inputArea = document.body;
        inputArea.addEventListener('mousedown', onPointerDown);
        inputArea.addEventListener('mousemove', onPointerMove);
        inputArea.addEventListener('mouseup', onPointerUp);
        inputArea.addEventListener('mouseleave', onPointerUp);
        inputArea.addEventListener('touchstart', onPointerDown, {passive: false});
        inputArea.addEventListener('touchmove', onPointerMove, {passive: false});
        inputArea.addEventListener('touchend', onPointerUp);
    }

    function createTrack() {
        const geometry = new THREE.BoxGeometry(LANE_WIDTH * 3 + 2, 1, 3000);
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
        const track = new THREE.Mesh(geometry, material);
        track.position.set(0, -0.5, -1450);
        track.receiveShadow = true;
        scene.add(track);

        const lineGeo = new THREE.PlaneGeometry(0.2, 3000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
        trackLines = new THREE.Group();
        const line1 = new THREE.Mesh(lineGeo, lineMat);
        line1.position.set(-LANE_WIDTH/2, 0.02, -1450); line1.rotation.x = -Math.PI / 2;
        const line2 = new THREE.Mesh(lineGeo, lineMat);
        line2.position.set(LANE_WIDTH/2, 0.02, -1450); line2.rotation.x = -Math.PI / 2;
        trackLines.add(line1); trackLines.add(line2);
        scene.add(trackLines);
    }

    function createCharacterConfig(colorHex) {
        const charGroup = new THREE.Group();
        const charBody = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.1 }); 

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.0, 16), mat);
        torso.position.y = 1.4; torso.castShadow = true; charBody.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), mat);
        head.position.y = 2.2; head.castShadow = true; charBody.add(head);

        const legGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
        const lLeg = new THREE.Mesh(legGeo, mat);
        lLeg.position.set(-0.18, 0.45, 0); lLeg.castShadow = true; charBody.add(lLeg);
        const rLeg = new THREE.Mesh(legGeo, mat);
        rLeg.position.set(0.18, 0.45, 0); rLeg.castShadow = true; charBody.add(rLeg);

        charGroup.add(charBody);
        return { root: charGroup, body: charBody, leftLeg: lLeg, rightLeg: rLeg };
    }

    function createTextSprite(text, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const context = canvas.getContext('2d');
        context.font = "Bold 36px 'Varela Round', sans-serif";
        context.fillStyle = color;
        context.textAlign = "center";
        context.fillText(text, 128, 48);
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(4, 1, 1);
        sprite.position.y = 3.5;
        return sprite;
    }

    function updateNameLabel(sprite, name) {
        const context = sprite.material.map.image.getContext('2d');
        context.clearRect(0, 0, 256, 64);
        context.fillText(name, 128, 48);
        sprite.material.map.needsUpdate = true;
    }

    function setupPlayers() {
        const myChar = createCharacterConfig(0xef4444);
        player = myChar.root; playerBody = myChar.body; leftLeg = myChar.leftLeg; rightLeg = myChar.rightLeg;
        playerLabel = createTextSprite("Sen", "#ffffff");
        player.add(playerLabel);
        scene.add(player);

        const oppChar = createCharacterConfig(0x3b82f6);
        opponent = oppChar.root; oppBody = oppChar.body; oppLeftLeg = oppChar.leftLeg; oppRightLeg = oppChar.rightLeg;
        oppLabel = createTextSprite("Rakip", "#yellow");
        opponent.add(oppLabel);
        opponent.position.set(0, -100, 500); // Hide initially
        scene.add(opponent);
    }

    function createFaceTexture(type, isMemoryBoard = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = isMemoryBoard ? 'transparent' : 'rgba(255, 255, 255, 0.9)';
        if(!isMemoryBoard) {
            ctx.beginPath(); ctx.roundRect(20, 20, 472, 472, 80); ctx.fill();
            ctx.lineWidth = 10; ctx.strokeStyle = '#e2e8f0'; ctx.stroke();
        }

        ctx.lineWidth = 35; ctx.lineCap = 'round';
        ctx.strokeStyle = isMemoryBoard ? '#ffffff' : '#1e293b';
        ctx.fillStyle = isMemoryBoard ? '#ffffff' : '#1e293b';
        
        // Eyes
        ctx.beginPath(); ctx.arc(170, 200, 25, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(342, 200, 25, 0, Math.PI * 2); ctx.fill();

        // Mouth
        ctx.beginPath();
        if (type === 'smile') ctx.arc(256, 260, 110, 0.1 * Math.PI, 0.9 * Math.PI);
        else if (type === 'sad') ctx.arc(256, 390, 110, 1.1 * Math.PI, 1.9 * Math.PI);
        else if (type === 'neutral') { ctx.moveTo(160, 310); ctx.lineTo(352, 310); }
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
    }

    function generateLevelData() {
        levelData.sequence = [];
        levelData.gates = [];
        
        for (let i = 0; i < 3; i++) {
            levelData.sequence.push(FACES[Math.floor(Math.random() * FACES.length)]);
            let rowFaces = [...FACES].sort(() => Math.random() - 0.5);
            levelData.gates.push(rowFaces);
        }
    }

    function spawnMemoryBoard(zPos) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(30, 58, 138, 0.95)'; 
        ctx.beginPath(); ctx.roundRect(10, 10, 1004, 492, 40); ctx.fill();
        ctx.lineWidth = 15; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 70px "Fredoka One", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`AŞAMA ${loopCount}: SIRAYI HATIRLA!`, 512, 120);

        const startX = 180; const spacing = 330;
        levelData.sequence.forEach((face, index) => {
            const faceCanvas = createFaceTexture(face, true).image;
            ctx.drawImage(faceCanvas, startX + (index * spacing) - 100, 180, 200, 200);
            if(index < 2) {
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 80px sans-serif';
                ctx.fillText('→', startX + (index * spacing) + 165, 300);
            }
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const geo = new THREE.PlaneGeometry(14, 7);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const board = new THREE.Mesh(geo, mat);
        
        board.position.set(0, 5.5, zPos);
        scene.add(board);
        memoryBoards.push(board);
    }

    function spawnGateRow(zPos, seqIndex) {
        const row = new THREE.Group();
        row.position.z = zPos;
        row.userData = { passed: false, seqIndex: seqIndex };
        
        let rowFaces = levelData.gates[seqIndex];
        const gateWidth = LANE_WIDTH * 0.95;
        const gateHeight = 4.5;

        for(let i=0; i<3; i++) {
            const laneOffset = (i - 1) * LANE_WIDTH; 
            const faceType = rowFaces[i];

            const geo = new THREE.BoxGeometry(gateWidth, gateHeight, 0.4);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 0.1, roughness: 0.1,
                transmission: 0.9, transparent: true, opacity: 0.8,
                clearcoat: 1.0, clearcoatRoughness: 0.1
            });
            const gateMesh = new THREE.Mesh(geo, mat);
            gateMesh.position.set(laneOffset, gateHeight/2, 0);
            gateMesh.receiveShadow = true;

            const texGeo = new THREE.PlaneGeometry(gateWidth * 0.6, gateWidth * 0.6);
            const texMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(faceType, false), transparent: true });
            const texMesh = new THREE.Mesh(texGeo, texMat);
            texMesh.position.set(laneOffset, gateHeight/2 + 0.5, 0.21); 

            row.add(gateMesh); row.add(texMesh);
            gateMesh.userData = { faceType: faceType, isGate: true, laneX: laneOffset };
        }
        scene.add(row);
        gates.push(row);
    }

    function updateProgressBar() {
        document.getElementById('progress-fill').style.width = `${(currentSequenceIndex / 3) * 100}%`;
    }

    function resetPlayerAndWorld() {
        player.position.set(0, 0, 0); playerBody.rotation.set(0,0,0);
        targetX = 0; loopCount = 1; speed = 0.6;
        
        gates.forEach(g => scene.remove(g)); gates = [];
        memoryBoards.forEach(b => scene.remove(b)); memoryBoards = [];

        spawnMemoryBoard(-80);
        spawnGateRow(-150, 0);
        spawnGateRow(-220, 1);
        spawnGateRow(-290, 2);
        updateProgressBar();
    }

    function onPointerDown(e) { if (state === 'PLAYING') { isDragging = true; previousPointerX = e.touches ? e.touches[0].clientX : e.clientX; } }
    function onPointerMove(e) {
        if (!isDragging || state !== 'PLAYING') return;
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        const deltaX = currentX - previousPointerX;
        targetX += deltaX * ((LANE_WIDTH * 2) / window.innerWidth * 1.5);
        targetX = Math.max(-BOUNDARY, Math.min(BOUNDARY, targetX));
        previousPointerX = currentX;
    }
    function onPointerUp(e) { isDragging = false; }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function handleGameOver(blameName) {
        state = 'GAMEOVER';
        document.getElementById('fail-blame').innerText = `${blameName} HATA YAPTI!`;
        setScreen('screen-gameover');
    }

    window.resetGame = () => {
        // Simple reload to reset state fully
        window.location.reload();
    }

    function animate() {
        requestAnimationFrame(animate);

        if (isMultiplayer && conn && conn.open) {
            conn.send({ type: 'sync', x: player.position.x, z: player.position.z, st: state });
        }

        if (state === 'PLAYING') {
            runTime += 0.15;
            player.position.z -= speed;
            player.position.x += (targetX - player.position.x) * 0.2; 

            playerBody.position.y = Math.abs(Math.sin(runTime)) * 0.2;
            playerBody.rotation.z = (targetX - player.position.x) * -0.05; 
            leftLeg.rotation.x = Math.sin(runTime) * 0.8; rightLeg.rotation.x = -Math.sin(runTime) * 0.8;
            leftLeg.position.y = 0.45 + Math.abs(Math.sin(runTime)) * 0.3; rightLeg.position.y = 0.45 + Math.abs(Math.cos(runTime)) * 0.3;

            // Endless Loop Trigger
            if (currentSequenceIndex >= 3) {
                loopCount++; speed += 0.02;
                if(isHost || !isMultiplayer) {
                    generateLevelData();
                    const nextZ = player.position.z;
                    spawnMemoryBoard(nextZ - 80);
                    spawnGateRow(nextZ - 150, 0); spawnGateRow(nextZ - 220, 1); spawnGateRow(nextZ - 290, 2);
                    if(isMultiplayer) conn.send({ type: 'new_loop', level: levelData, zPos: nextZ });
                }
                currentSequenceIndex = 0; updateProgressBar();
            }

            // Collision Check
            for (let i = 0; i < gates.length; i++) {
                const row = gates[i];
                if (row.position.z > player.position.z - 1.0 && row.position.z < player.position.z + 1.0) {
                    if (row.userData.passed) continue; 
                    let hitFace = null, closestDist = Infinity;
                    
                    row.children.forEach(child => {
                        if (child.userData.isGate) {
                            const dist = Math.abs(player.position.x - child.userData.laneX);
                            if (dist < closestDist && dist < 1.5) { closestDist = dist; hitFace = child.userData.faceType; }
                        }
                    });

                    if (hitFace) {
                        const requiredFace = levelData.sequence[row.userData.seqIndex];
                        if (hitFace === requiredFace) {
                            row.userData.passed = true; row.position.y -= 100;
                            currentSequenceIndex = Math.max(currentSequenceIndex, row.userData.seqIndex + 1);
                            updateProgressBar();
                            if(isMultiplayer && conn) conn.send({ type: 'gate_passed', index: row.userData.seqIndex });
                        } else {
                            handleGameOver(myName);
                            if(isMultiplayer && conn) conn.send({ type: 'gameover', blame: myName });
                        }
                    }
                }
            }

            // Memory Board Fly Away
            memoryBoards.forEach(b => { if(player.position.z < b.position.z) b.position.y += 0.5; });

            // Cleanup old objects
            if(gates.length > 6) {
                const oldG = gates.shift(); scene.remove(oldG);
            }
            if(memoryBoards.length > 2) {
                const oldB = memoryBoards.shift(); scene.remove(oldB);
            }

        } else if (state === 'GAMEOVER') {
            if (playerBody.rotation.x > -Math.PI / 2) {
                playerBody.rotation.x -= 0.1;
                playerBody.position.y = Math.max(0.2, playerBody.position.y - 0.05);
            }
        }

        // Multiplayer Visual Sync
        if (isMultiplayer && opponent) {
            opponent.position.x += (oppTargetX - opponent.position.x) * 0.3;
            // Snappy Z sync to prevent desync look
            if(Math.abs(oppTargetZ - opponent.position.z) > 10) opponent.position.z = oppTargetZ;
            else opponent.position.z += (oppTargetZ - opponent.position.z) * 0.3;

            if (oppState === 'PLAYING') {
                oppRunTime += 0.15; oppBody.rotation.x = 0;
                oppBody.position.y = Math.abs(Math.sin(oppRunTime)) * 0.2;
                oppLeftLeg.rotation.x = Math.sin(oppRunTime) * 0.8; oppRightLeg.rotation.x = -Math.sin(oppRunTime) * 0.8;
            } else if (oppState === 'GAMEOVER') {
                oppBody.rotation.x = -Math.PI / 2; oppBody.position.y = 0.2;
            }
        }

        // Camera & Lights
        camera.position.z += ((player.position.z + 8) - camera.position.z) * 0.15;
        camera.position.x += ((player.position.x * 0.4) - camera.position.x) * 0.15;
        camera.lookAt(player.position.x * 0.2, 2, player.position.z - 10);

        scene.children.forEach(child => {
            if(child.type === 'DirectionalLight') {
                child.position.z = player.position.z + 10;
                child.target.position.set(0, 0, player.position.z);
                child.target.updateMatrixWorld();
            }
        });

        renderer.render(scene, camera);
    }
</script>
